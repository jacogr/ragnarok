      # Keep growth independent of earlier panel failures while sharing this runner's warm setup.
      - name: Measure sustained storage growth and SDK IO
        if: ${{ !cancelled() && (matrix.family.group == 'bench-storage-growth' || (matrix.family.group == 'bench-storage' && inputs.suite != 'bench-storage')) }}
        run: make bench-storage-growth
      - name: Show sustained storage growth
        if: ${{ always() && (matrix.family.group == 'bench-storage-growth' || (matrix.family.group == 'bench-storage' && inputs.suite != 'bench-storage')) }}
        run: make summary-storage-growth SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain sustained storage evidence
        if: ${{ always() && (matrix.family.group == 'bench-storage-growth' || (matrix.family.group == 'bench-storage' && inputs.suite != 'bench-storage')) }}
        uses: *upload-artifact
        with:
          name: bench-storage-growth-${{ github.run_attempt }}
