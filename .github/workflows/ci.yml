            build/ci/*.log

  # Every merge measures the same complete current-source PVM cohort on both native CPUs.
  # Focused manual requests reuse this runner/report protocol, without diagnostic benchmark paths.
  pvm-comparison:
    needs: fixture-provenance
    if: ${{ !cancelled() && (needs['fixture-provenance'].result == 'success' || needs['fixture-provenance'].result == 'skipped') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'bench-pvm' || inputs.suite == 'bench-doom' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full'))) }}
    # Reports retain the actual API job name without maintaining a separate display-name selector.
    name: &pvm-performance-name ${{ format('Perf / PVM ({0})', matrix.family.name) }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON((inputs.suite == 'bench-pvm' || inputs.suite == 'bench-doom') && inputs.pvm_architecture == 'arm64' && '[{"name":"Linux ARM64","group":"arm64","os":"ubuntu-26.04-arm"}]' || (inputs.suite == 'bench-pvm' || inputs.suite == 'bench-doom') && inputs.pvm_architecture == 'x86_64' && '[{"name":"Linux x86-64","group":"x86_64","os":"ubuntu-26.04"}]' || '[{"name":"Linux ARM64","group":"arm64","os":"ubuntu-26.04-arm"},{"name":"Linux x86-64","group":"x86_64","os":"ubuntu-26.04"}]') }}
    runs-on: ${{ matrix.family.os }}
    env:
      PVM_CI_SYSTEM: Linux
      PVM_CI_ARCH: ${{ matrix.family.group }}
      PVM_CI_JOB_NAME: *pvm-performance-name
      PVM_PERF_SCOPE: ${{ inputs.suite == 'bench-doom' && 'doom' || 'all' }}
    steps:
      - *checkout
      - *python
      - *tool-download-cache
      - *model-download-cache
      - *cargo-download-cache
      - *built-cache-host
      - *model-built-cache
      - *crypto-built-cache
      - *quic-built-cache
      - *polkavm-built-cache
      - name: Install pinned asset decompression prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd
      - name: Qualify and compare current PVM backends
        run: make bench-pvm-performance
      - name: Show complete current-source comparison
        if: always()
        run: |
          if test -f build/tests/pvm-performance/summary.md; then
            cat build/tests/pvm-performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'PVM comparison did not complete; inspect the native qualification and build logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain source-bound PVM measurements and failure evidence
        if: always()
        uses: *upload-artifact
        with:
          name: pvm-performance-${{ matrix.family.group }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/tests/pvm-performance/*.json
            build/tests/pvm-performance/*.csv
            build/tests/pvm-performance/*.md
            build/tests/pvm-performance/**/*.log
            build/tests/pvm-native/*.json
            build/tests/pvm-native/pvm_shared_read_widths_*-evidence/pvm_read_widths_*.json
            build/tests/pvm-native/*.log
            build/tests/native/selected/pvm_memory_reuse.log
            build/tests/native/compiler-*/evidence/pvm_memory_reuse.json
            build/ci/*.log

  pvm-fuzz:
    needs: fixture-provenance
    if: ${{ !cancelled() && (needs['fixture-provenance'].result == 'success' || needs['fixture-provenance'].result == 'skipped') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'fuzz' || inputs.suite == 'fuzz-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:fuzz' || github.event.label.name == 'ci:full'))) }}
    name: Fuzz / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.suite == 'fuzz-pvm' && '[{"name":"PVM","group":"pvm"}]' || '[{"name":"PVM","group":"pvm"},{"name":"JAM (1/3)","group":"jam-interface","shard":"1/3"},{"name":"JAM (2/3)","group":"jam-interface","shard":"2/3"},{"name":"JAM (3/3)","group":"jam-interface","shard":"3/3"},{"name":"JAM Network","group":"jam-network"}]') }}
    runs-on: *ubuntu-x86-version
    env:
      FUZZ_RUNS: "10000"
      JAM_FUZZ_SHARD: ${{ matrix.family.shard }}
      CI_SHARD_SEED: ${{ github.run_id }}
    steps:
      - *checkout
      - *python
      - *tool-download-cache
      - *model-download-cache
      - *cargo-download-cache
      - *built-cache-host
      - *model-built-cache
      - *crypto-built-cache
      - *quic-built-cache
      - *polkavm-built-cache
      - name: Validate verification inventory
        run: *inventory-run
      - name: Run pinned upstream campaigns and JAM bridge
        if: matrix.family.group == 'pvm'
        run: make fuzz-pvm-upstream
      - name: Show fuzz coverage and bridge accounting
        if: always() && matrix.family.group == 'pvm'
        run: |
          if test -f build/pvm-upstream-fuzz/summary.md; then
            cat build/pvm-upstream-fuzz/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'PVM fuzz campaign did not complete; inspect results.json and logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain fuzz evidence and failing inputs
        if: always() && matrix.family.group == 'pvm'
        uses: *upload-artifact
        with:
          name: pvm-fuzz-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/pvm-upstream-fuzz/*.log
            build/pvm-upstream-fuzz/results.json
            build/pvm-upstream-fuzz/summary.md
            build/pvm-upstream-fuzz/artifacts/

      - name: Verify current JAM engine interface and whole-map STF cases
        if: matrix.family.group == 'jam-interface'
        run: make check-jam-fuzzer-interface
      - name: Show JAM interface verdict and pending engine validation
        if: always() && matrix.family.group == 'jam-interface'
        run: |
          summary="build/tests/jam-fuzzer-interface/${JAM_FUZZ_SHARD/\//-of-}/summary.md"
          if test -f "$summary"; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'JAM interface verification did not complete; live engine validation remains pending.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain JAM interface evidence
        if: always() && matrix.family.group == 'jam-interface'
        uses: *upload-artifact
        with:
          name: jam-fuzzer-interface-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/ci/*.log
            build/tests/jam-fuzzer-interface/**/*.log
            build/tests/jam-fuzzer-interface/**/results.json
            build/tests/jam-fuzzer-interface/**/summary.md

      - name: Verify issue215 JAM network target readiness
        if: matrix.family.group == 'jam-network'
        run: make check-jam-network
      - name: Show JAM network readiness and pending live campaign
        if: always() && matrix.family.group == 'jam-network'
        run: |
          if test -f build/tests/jam-network/summary.md; then
            cat build/tests/jam-network/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'JAM network target verification did not complete; live campaign remains pending.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain JAM network evidence
        if: always() && matrix.family.group == 'jam-network'
        uses: *upload-artifact
        with:
          name: jam-network-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/tests/jam-network/*.log
            build/tests/jam-network/*.json
            build/tests/jam-network/summary.md
