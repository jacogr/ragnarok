      - name: Show child-local storage memory ceilings
        if: ${{ always() && matrix.family.group == 'bench-storage' }}
        run: make summary-storage-memory-ceilings SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain storage speed evidence
        if: ${{ always() && matrix.family.group == 'bench-storage' }}
