  # Regular Perf includes the exact-master public/core/lifecycle comparison on one runner.
  pvm-comparison:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'jit-x86' || inputs.suite == 'jit-x86-replay' || inputs.suite == 'jit-arm-check' || inputs.suite == 'jit-arm-profile' || inputs.suite == 'jit-arm-calibrate' || inputs.suite == 'jit-arm-replay' || inputs.suite == 'perf' || inputs.suite == 'bench-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full')) }}
    name: Perf / PVM Comparison (${{ matrix.family.name }})
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON((inputs.suite == 'jit-arm-check' || inputs.suite == 'jit-arm-profile' || inputs.suite == 'jit-arm-calibrate' || inputs.suite == 'jit-arm-replay') && '[{"name":"Linux ARM64","group":"arm64","os":"ubuntu-26.04-arm"}]' || (inputs.suite == 'jit-x86' || inputs.suite == 'jit-x86-replay') && '[{"name":"Linux x86-64","group":"x86_64","os":"ubuntu-26.04"}]' || '[{"name":"Linux ARM64","group":"arm64","os":"ubuntu-26.04-arm"},{"name":"Linux x86-64","group":"x86_64","os":"ubuntu-26.04"}]') }}
    runs-on: ${{ matrix.family.os }}
    env:
      PVM_CI_SYSTEM: Linux
      PVM_CI_ARCH: ${{ matrix.family.group }}
      PVM_COMPARE_PREPARED_BASE: ${{ inputs.pvm_prepared_baseline }}
      PVM_JIT_PROCESS_REPLAYS: ${{ (inputs.suite == 'jit-x86-replay' || inputs.suite == 'jit-arm-replay') && '1' || '0' }}
    steps:
      - *checkout
      - *python
      - name: Resolve current master and optional prepared baseline
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          python3 - <<'PYBASE'
          import os,re,subprocess
          baseline=os.environ.get('PVM_COMPARE_PREPARED_BASE','')
          if baseline:
              if re.fullmatch(r'[0-9a-f]{40}',baseline) is None:
                  raise ValueError('Prepared baseline must be a full lowercase commit SHA')
              subprocess.run(['git','fetch','--no-tags','origin',baseline],check=True)
          PYBASE
      - name: Install DOOM asset decompressor
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd
      - name: Install scoped native profiler
        if: ${{ inputs.suite == 'jit-x86' || inputs.suite == 'jit-arm-profile' || inputs.suite == 'jit-arm-calibrate' || inputs.suite == 'jit-arm-replay' }}
        run: sudo apt-get install --yes --no-install-recommends valgrind binutils
      - name: Qualify opt-in Linux x86-64 JIT
        if: ${{ inputs.suite == 'jit-x86' || inputs.suite == 'jit-x86-replay' }}
        run: make check-pvm-x86-jit
      - name: Compare opt-in x86 JIT and checked interpreters
        if: ${{ inputs.suite == 'jit-x86' || inputs.suite == 'jit-x86-replay' }}
        run: make bench-pvm-x86-applications
      - name: Profile current x86 invocation boundaries
        if: ${{ inputs.suite == 'jit-x86' }}
        run: make profile-pvm-x86-jit
      - name: Qualify PVM on the native Linux architecture
        if: ${{ inputs.suite != 'jit-x86' && inputs.suite != 'jit-x86-replay' && inputs.suite != 'jit-arm-calibrate' }}
        run: make check-pvm-native
      - name: Compare public x86 JIT and checked interpreters
        if: ${{ matrix.family.group == 'x86_64' && inputs.suite != 'jit-x86' && inputs.suite != 'jit-x86-replay' && inputs.suite != 'jit-arm-calibrate' }}
        run: make bench-pvm-x86-applications
      - name: Compare public ARM64 JIT and checked interpreters
        if: ${{ matrix.family.group == 'arm64' && inputs.suite != 'jit-arm-calibrate' && inputs.suite != 'jit-arm-check' }}
        env:
          PVM_JIT_BASELINE: ${{ inputs.pvm_prepared_baseline }}
        run: make bench-pvm-arm64-applications
      - name: Calibrate ARM collection without guest rebuilds
        if: ${{ inputs.suite == 'jit-arm-calibrate' }}
        run: make calibrate-pvm-arm64-linux
      - name: Profile paired ARM invocation boundaries
        if: ${{ inputs.suite == 'jit-arm-profile' }}
        run: make profile-pvm-arm64-linux
      - name: Show complete comparison
        if: always()
        run: |
          for summary in build/tests/pvm-x86-jit/summary.md build/tests/pvm-x86-applications/summary.md build/tests/pvm-interpreter-linux/summary.md build/tests/pvm-arm64-applications/summary.md; do
            if test -f "$summary"; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain exact-source timing and refusal evidence
        if: always()
        uses: *upload-artifact
        with:
          name: pvm-comparison-${{ matrix.family.group }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/pvm-x86-applications/*.json
            build/tests/pvm-x86-applications/*.log
            build/tests/pvm-x86-applications/summary.md
            build/tests/pvm-x86-profiles/*
            build/tests/pvm-arm64-profiles/*
            build/tests/pvm-x86-jit/*.json
            build/tests/pvm-x86-jit/*.log
            build/tests/pvm-x86-jit/summary.md
            build/tests/pvm-interpreter-linux/*.json
            build/tests/pvm-interpreter-linux/*.log
            build/tests/pvm-interpreter-linux/summary.md
            build/tests/pvm-native/*.json
            build/tests/pvm-native/*.log
            build/tests/pvm-native/region-refusal
            build/tests/pvm-native/region-refusal-forced
            build/tests/pvm-arm64-applications/*.json
            build/tests/pvm-arm64-applications/*.log
            build/tests/pvm-arm64-applications/summary.md
            build/tests/pvm-doom/*.json
            build/tests/pvm-doom/*.log
            build/ci/*.log

  # Fuzz group: named workloads report their own results.
  pvm-fuzz:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'fuzz' || inputs.suite == 'fuzz-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:fuzz' || github.event.label.name == 'ci:full')) }}
    name: Fuzz / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.suite == 'fuzz-pvm' && '[{"name":"PVM","group":"pvm"}]' || '[{"name":"PVM","group":"pvm"},{"name":"JAM (1/3)","group":"jam-interface","shard":"1/3"},{"name":"JAM (2/3)","group":"jam-interface","shard":"2/3"},{"name":"JAM (3/3)","group":"jam-interface","shard":"3/3"},{"name":"JAM Network","group":"jam-network"}]') }}
    runs-on: *ubuntu-x86-version
    env:
      FUZZ_RUNS: "10000"
      JAM_FUZZ_SHARD: ${{ matrix.family.shard }}
      CI_SHARD_SEED: ${{ github.run_id }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Run pinned upstream campaigns and JAM bridge
        if: matrix.family.group == 'pvm'
        run: make fuzz-pvm-upstream
      - name: Show fuzz coverage and bridge accounting
        if: always() && matrix.family.group == 'pvm'
        run: |
          if test -f build/pvm-upstream-fuzz/summary.md; then
            cat build/pvm-upstream-fuzz/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'PVM fuzz campaign did not complete; inspect results.json and logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain fuzz evidence and failing inputs
        if: always() && matrix.family.group == 'pvm'
        uses: *upload-artifact
        with:
          name: pvm-fuzz-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/pvm-upstream-fuzz/*.log
            build/pvm-upstream-fuzz/results.json
            build/pvm-upstream-fuzz/summary.md
            build/pvm-upstream-fuzz/artifacts/

      - name: Verify current JAM engine interface and whole-map STF cases
        if: matrix.family.group == 'jam-interface'
        run: make check-jam-fuzzer-interface
      - name: Show JAM interface verdict and pending engine validation
        if: always() && matrix.family.group == 'jam-interface'
        run: |
          summary="build/tests/jam-fuzzer-interface/${JAM_FUZZ_SHARD/\//-of-}/summary.md"
          if test -f "$summary"; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'JAM interface verification did not complete; live engine validation remains pending.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain JAM interface evidence
        if: always() && matrix.family.group == 'jam-interface'
        uses: *upload-artifact
        with:
          name: jam-fuzzer-interface-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/ci/*.log
            build/tests/jam-fuzzer-interface/**/*.log
            build/tests/jam-fuzzer-interface/**/results.json
            build/tests/jam-fuzzer-interface/**/summary.md

      - name: Verify issue215 JAM network target readiness
        if: matrix.family.group == 'jam-network'
        run: make check-jam-network
      - name: Show JAM network readiness and pending live campaign
        if: always() && matrix.family.group == 'jam-network'
        run: |
          if test -f build/tests/jam-network/summary.md; then
            cat build/tests/jam-network/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'JAM network target verification did not complete; live campaign remains pending.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain JAM network evidence
        if: always() && matrix.family.group == 'jam-network'
        uses: *upload-artifact
        with:
          name: jam-network-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/tests/jam-network/*.log
            build/tests/jam-network/*.json
            build/tests/jam-network/summary.md

  # Private frozen cohort; all ordinary verification routes remain byte-for-byte unchanged.
  final-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'final-evidence' }}
    name: Final interpreter evidence / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-26.04-arm
            arch: arm64
    env:
      PVM_CI_SYSTEM: Linux
      PVM_CI_ARCH: ${{ matrix.arch }}
      # This PVM-only cohort imports no UI; the pinned minifier has no Linux ARM64 asset.
      UI_MINIFY: "0"
    steps:
      - *checkout
      - *python
      - name: Fetch the exact frozen landed source
        run: git fetch --no-tags --depth=1 origin 4a29188758026f062e2b970b96df2665d8764d4e
      - name: Provision pinned build dependencies
        run: make setup
      - name: Verify discovered source contracts
        run: make check-inventory
      - name: One frozen same-image lifecycle and memory cohort
        run: python3 tools/pvm_final_lifecycle_ci.py
      - name: Retain complete source, image, state and measurement evidence
        if: always()
        uses: *upload-artifact
        with:
          name: pvm-final-evidence-${{ matrix.arch }}-${{ github.run_attempt }}
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
          path: |
            build/tests/pvm-final-lifecycle/
            build/ci/
