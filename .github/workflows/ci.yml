# Defines CI verification and evidence collection. Exposes independently scheduled checks
# through GitHub Actions jobs using the maintained Make targets.

name: CI

# Check master after pushes/merges; PR workloads run only when explicitly labeled.
"on":
  push:
    branches: [master]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Verification scope
        type: choice
        options: [unit, e2e, docker, interop, perf, pvm-reference, bench-pvm, bench-storage, full]
        default: full
        required: true

permissions:
  contents: read

# New requests supersede earlier runs for the same ref; unrelated labels cannot cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.label.name != 'ci:unit' && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:e2e' && github.event.label.name != 'ci:interop' && github.event.label.name != 'ci:perf' && github.run_id || github.ref }}
  cancel-in-progress: true

# All verification groups use the same shell and Python output policy.
defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Exercise the shipped minified JS/CSS in every native/browser verification job.
  UI_MINIFY: "1"

# Independent groups run concurrently on separate VMs; no job requires another job's artifacts.
jobs:
  modules:
    if: &requested ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full')) }}
    name: Source compilation
    timeout-minutes: 30
    strategy: &os-strategy
      fail-fast: false
      matrix:
        os: &ci-os [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &python
        name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Fail missing or inconsistent verification inputs before any native setup.
      - &inventory
        name: Validate verification inventory
        run: make check-inventory
      - name: Source compilation
        run: make check-modules
      - &summary
        name: Show verification coverage
        if: always()
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: &upload-artifact actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}-modules-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/modules/*.log
            build/tests/modules/results.json

  models:
    if: *requested
    name: Model verification
    timeout-minutes: 15
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Check lifecycle safety, mutants and reachability
        run: make check-models
      - *summary
      # Retain only replayable models and diagnostics, never compiler/dependency trees.
      - name: Retain model verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-models-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/model-tools.log
            build/ci/models.log
            build/ci/setup.log
            build/tests/models/*.log
            build/tests/models/*.nif
            build/tests/models/results.json

  python:
    if: *requested
    name: Python reference and tooling tests
    timeout-minutes: 15
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Python reference and tooling tests
        run: make check-python
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-python-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/python/*.log
            build/tests/python/results.json

  guards:
    if: &full ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.label.name == 'ci:full') }}
    name: Compiler rejection guards
    timeout-minutes: 30
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Compiler rejection guards
        run: make check-guards
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-guards-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/guards/*.log
            build/tests/guards/results.json
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log

  unit:
    if: *requested
    name: Unit shard ${{ matrix.shard }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: *ci-os
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    env:
      UNIT_SHARD: ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Native unit and codec tests
        run: make check-unit
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-unit-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/runtime/*.log
            build/tests/runtime/results.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Retain one stable PR gate; failed, cancelled or skipped shards must never look successful.
  unit-status:
    name: Native unit and codec tests
    needs: unit
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every unit shard
        env:
          SHARDS_RESULT: ${{ needs.unit.result }}
        run: test "$SHARDS_RESULT" = success

  failures:
    if: *full
    name: Contract shard ${{ matrix.shard }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: *ci-os
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      FAILURE_SHARD: ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Runtime failure and contract tests
        run: make check-failures
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-failures-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/failures/*.log
            build/tests/failures/results.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Preserve the stable contract gate and require every partition, including specialized controls.
  failures-status:
    name: Runtime failure and contract tests
    needs: failures
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.label.name == 'ci:full')) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every contract shard
        env:
          SHARDS_RESULT: ${{ needs.failures.result }}
        run: test "$SHARDS_RESULT" = success

  e2e:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'e2e' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:e2e' || github.event.label.name == 'ci:full')) }}
    name: End-to-end networking tests
    timeout-minutes: 60
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: End-to-end networking tests
        run: make check-e2e
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-e2e-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/e2e/*.log
            build/tests/e2e/results.json
            build/tests/e2e/telemetry*/*.log
            build/tests/e2e/offload/*.log
            build/tests/e2e/offload/resources.json
            build/tests/e2e/admission/*.log
            build/tests/e2e/admission/resources.json
            build/tests/e2e/closed-before-request/*.log
            build/tests/e2e/endpoint-soak/*.log
            build/tests/e2e/endpoint-soak/resources.json
            build/tests/e2e/mesh/*.log
            build/tests/e2e/mesh/resources.json
            build/tests/e2e/mesh-bad-pin/*.log
            build/tests/e2e/mesh-disruption/*.log
            build/tests/e2e/mesh-disruption/resources.json
            build/tests/e2e/retained-service/*.log
            build/tests/e2e/retained-service/resources.json
            build/tests/e2e/retained-integration/*.log
            build/tests/e2e/retained-integration/resources.json
            build/tests/e2e/peer-cases/**/*.log
            build/tests/e2e/rpc/browser/*.log
            build/tests/e2e/rpc/browser/*.json
            build/tests/e2e/rpc/browser/*.png
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Keep Interop jobs adjacent; group requests run every implementation comparison.
  # Pinned public-API comparisons remain distinct from frozen native fixtures and future fuzzing.
  pvm-reference:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'interop' || inputs.suite == 'pvm-reference' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:interop' || github.event.label.name == 'ci:full')) }}
    name: Interop PVM
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      RAGNAROK_PVM_REFERENCE_BACKEND: interpreter
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Compare pinned PolkaVM and native PVM fixtures
        run: make check-pvm-reference
      # Retain diagnostics even if provisioning failed before results.json could be created.
      - name: Show PVM comparison summary
        if: always()
        run: make summary-pvm-reference SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain PVM comparison evidence
        if: always()
        uses: *upload-artifact
        with:
          name: pvm-reference-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/pvm-reference/*.log
            build/tests/pvm-reference/results.json
            build/tests/pvm-reference/summary.md
            build/tests/native/selected/pvm_*.log
            build/tests/native/preparation/selected-pvm_*.json

  telemetry-interop:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'interop' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:interop' || github.event.label.name == 'ci:full')) }}
    name: Interop Telemetry
    timeout-minutes: 60
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Build pinned collector and verify real peer events
        run: make check-telemetry-interop-ci
      # Keep diagnostics on setup/build/test failures; exclude fixture keys and dependency trees.
      - name: Retain interoperability evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-telemetry-interop-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/telemetry-interop/**/*.log
            build/tests/telemetry-interop/results.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Build locally and execute the final image; no registry credentials or image publishing.
  docker:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'docker' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full')) }}
    name: Docker image
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Build and smoke-test Docker image
        run: make check-docker
      - name: Retain Docker build diagnostics
        if: always()
        uses: *upload-artifact
        with:
          name: docker-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/docker-build.log
            build/ci/docker-smoke.log

  # Perf jobs publish validated measurements on master pushes and explicit group/full requests.
  bench-pvm:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'bench-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full')) }}
    name: Perf PVM
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Measure validated PVM workloads
        run: make bench-pvm
      - name: Show speed comparison table
        if: always()
        run: make summary-pvm-benchmark SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain raw benchmark evidence
        if: always()
        uses: *upload-artifact
        with:
          name: bench-pvm-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/pvm-benchmark/*.log
            build/tests/pvm-benchmark/results.json
            build/tests/pvm-benchmark/samples.csv
            build/tests/pvm-benchmark/summary.md
            build/pvm-benchmark/native-build.log
            build/ci/*.log

  # Keep storage adjacent to other Perf jobs and use the same group/full request policy.
  bench-storage:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'bench-storage' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full')) }}
    name: Perf Storage
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Compare validated memory and durable storage workloads
        run: make bench-storage
      - name: Show storage speed comparison
        if: always()
        run: make summary-storage-benchmark SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain storage speed evidence
        if: always()
        uses: *upload-artifact
        with:
          name: bench-storage-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/storage-benchmark/*.log
            build/tests/storage-benchmark/results.json
            build/tests/storage-benchmark/samples.csv
            build/tests/storage-benchmark/summary.md
            build/tests/storage-benchmark/growth/*.log
            build/tests/storage-benchmark/growth/results.json
            build/tests/storage-benchmark/growth/samples.csv
            build/tests/storage-benchmark/growth/publications.csv
            build/tests/storage-benchmark/growth/io/*.log
            build/tests/storage-benchmark/growth/io/results.json
            build/tests/storage-benchmark/growth/io/calls.csv
            build/ci/*.log
