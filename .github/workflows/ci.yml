# Defines CI verification and evidence collection. Exposes independently scheduled checks
# through GitHub Actions jobs using the maintained Make targets.

name: CI

# Smoke-check every PR update; heavy verification remains explicit on PRs and automatic on master.
"on":
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Verification scope
        type: choice
        options: [smoke, jit-x86, jit-x86-replay, jit-arm-check, jit-arm-profile, jit-arm-calibrate, jit-arm-replay, unit, e2e, build, docker, interop, perf, ref-pvm, fuzz, fuzz-pvm, bench-pvm, bench-doom, pvm-backends, bench-storage, bench-storage-growth, full, final-evidence]
        default: full
        required: true
      contract_measure_bundles:
        description: Measure opt-in Contract bundles against standalone builds in cold caches
        type: boolean
        default: false
        required: false
      pvm_prepared_baseline:
        description: Optional full commit SHA for a paired prior prepared interpreter
        type: string
        default: ""
        required: false

      pvm_doom_calls:
        description: "Shared-backend DOOM calls (1 is a sizing pilot; 2 is the continuing check)"
        required: false
        type: choice
        default: "2"
        options: ["1", "2"]

permissions:
  contents: read

# New requests supersede earlier runs for the same ref; unrelated labels cannot cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.state != 'open' && github.run_id || github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.action != 'labeled' || github.event.label.name == 'lgtm') && format('smoke-{0}', github.event.pull_request.number) || github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name != 'ci:unit' && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:docker' && github.event.label.name != 'ci:e2e' && github.event.label.name != 'ci:interop' && github.event.label.name != 'ci:perf' && github.event.label.name != 'ci:fuzz' && github.run_id || github.ref }}
  cancel-in-progress: true

# All verification groups use the same shell and Python output policy.
defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Exercise the shipped minified JS/CSS in every native/browser verification job.
  UI_MINIFY: "1"

# Independent groups run concurrently on separate VMs; no job requires another job's artifacts.
jobs:
  # One Build matrix owns the fast PR gate, tooling and native packaging/checks.
  # Build group: named workloads report their own results.
  build:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'smoke' || inputs.suite == 'unit' || inputs.suite == 'build' || inputs.suite == 'docker' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:docker' || github.event.label.name == 'ci:full' || github.event.label.name == 'lgtm')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.action != 'labeled') }}
    name: Build / ${{ matrix.family.name }}
    timeout-minutes: &ci-job-timeout 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - &ubuntu-x86-version ubuntu-26.04
        family: ${{ fromJSON((inputs.suite == 'docker' || github.event.label.name == 'ci:docker') && '[{"name":"Docker","group":"docker","platform":""}]' || (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:full')) && '[{"name":"Smoke","group":"smoke","platform":""},{"name":"Tooling","group":"python","platform":""},{"name":"Linux & Docker","group":"binary","platform":"linux-amd64"},{"name":"macOS","group":"binary","os":"macos-15","platform":"macos-arm64"}]' || ((github.event_name == 'workflow_dispatch' && inputs.suite == 'unit') || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:unit')) && '[{"name":"Smoke","group":"smoke","platform":""},{"name":"Tooling","group":"python","platform":""},{"name":"Linux Checks","group":"checks","platform":"linux-amd64"}]' || inputs.suite == 'build' && '[{"name":"Linux & Docker","group":"binary","platform":"linux-amd64"},{"name":"macOS","group":"binary","os":"macos-15","platform":"macos-arm64"}]' || '[{"name":"Smoke","group":"smoke","platform":""}]') }}
    runs-on: ${{ matrix.family.os || matrix.os }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &python
        name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate verification inventory
        if: ${{ matrix.family.group != 'smoke' }}
        run: &inventory-run make check-inventory
      - name: Check all formatting and smoke-compile all production modules
        if: ${{ matrix.family.group == 'smoke' }}
        run: make check-smoke
      - name: Retain smoke diagnostics
        if: ${{ always() && matrix.family.group == 'smoke' }}
        uses: &upload-artifact actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/smoke/*.log
            build/tests/smoke/results.json
      - name: Check references and tooling
        if: ${{ matrix.family.group == 'python' }}
        run: make check-python
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group == 'python' }}
        run: make summary-${{ matrix.family.group }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: ${{ always() && matrix.family.group == 'python' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.family.os || matrix.os }}-python-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/python/*.log
            build/tests/python/results.json
      - name: Check lifecycle safety, mutants and reachability
        if: ${{ !cancelled() && matrix.family.group == 'python' }}
        run: make check-models
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group == 'python' }}
        run: make summary-models SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      # Retain only replayable models and diagnostics, never compiler/dependency trees.
      - name: Retain model verification evidence
        if: ${{ always() && matrix.family.group == 'python' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.family.os || matrix.os }}-models-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/model-tools.log
            build/ci/models.log
            build/ci/setup.log
            build/tests/models/*.log
            build/tests/models/*.nif
            build/tests/models/results.json
      - name: Check compiler rejection guards
        # Earlier tooling/model failures must not suppress the independent rejection checks.
        if: ${{ !cancelled() && matrix.family.group == 'python' }}
        run: make check-guards
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group == 'python' }}
        run: make summary-guards SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: ${{ always() && matrix.family.group == 'python' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.family.os || matrix.os }}-guards-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/guards/*.log
            build/tests/guards/results.json
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
      - name: Build, package and smoke-test relocated peer
        if: ${{ matrix.family.group == 'binary' }}
        run: make package-binary
      - name: Retain downloadable binary archive
        if: ${{ matrix.family.group == 'binary' }}
        uses: *upload-artifact
        with:
          name: ragnarok-${{ matrix.family.platform }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/dist/ragnarok-${{ matrix.family.platform }}.tar.gz
            build/dist/ragnarok-${{ matrix.family.platform }}.tar.gz.sha256
      - name: Retain binary build diagnostics
        if: ${{ always() && matrix.family.group == 'binary' }}
        uses: *upload-artifact
        with:
          name: binary-${{ matrix.family.platform }}-diagnostics-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log
      - name: Check every production module in release mode
        if: ${{ !cancelled() && (matrix.family.group == 'checks' || (matrix.family.group == 'binary' && matrix.family.platform == 'linux-amd64')) }}
        run: make check-modules
      - name: Show verification coverage
        if: ${{ always() && (matrix.family.group == 'checks' || (matrix.family.group == 'binary' && matrix.family.platform == 'linux-amd64')) }}
        run: make summary-modules SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: ${{ always() && (matrix.family.group == 'checks' || (matrix.family.group == 'binary' && matrix.family.platform == 'linux-amd64')) }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.family.os || matrix.os }}-modules-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/modules/*.log
            build/tests/modules/results.json
      # The image keeps its isolated build and still runs after a native archive failure.
      - name: Build and smoke-test Docker image
        if: ${{ !cancelled() && (matrix.family.group == 'docker' || (matrix.family.group == 'binary' && matrix.family.platform == 'linux-amd64')) }}
        run: make check-docker
      - name: Retain Docker build diagnostics
        if: ${{ always() && (matrix.family.group == 'docker' || (matrix.family.group == 'binary' && matrix.family.platform == 'linux-amd64')) }}
        uses: *upload-artifact
        with:
          name: docker-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/docker-build.log
            build/ci/docker-smoke.log

  # Unit group: named workloads report their own results.
  unit:
    if: &requested ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full')) }}
    name: Unit / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: &ci-os [*ubuntu-x86-version]
        family: ${{ fromJSON('[{"name":"Test (1/16)","shard":"1/16","group":"suites"},{"name":"Test (2/16)","shard":"2/16","group":"suites"},{"name":"Test (3/16)","shard":"3/16","group":"suites"},{"name":"Test (4/16)","shard":"4/16","group":"suites"},{"name":"Test (5/16)","shard":"5/16","group":"suites"},{"name":"Test (6/16)","shard":"6/16","group":"suites"},{"name":"Test (7/16)","shard":"7/16","group":"suites"},{"name":"Test (8/16)","shard":"8/16","group":"suites"},{"name":"Test (9/16)","shard":"9/16","group":"suites"},{"name":"Test (10/16)","shard":"10/16","group":"suites"},{"name":"Test (11/16)","shard":"11/16","group":"suites"},{"name":"Test (12/16)","shard":"12/16","group":"suites"},{"name":"Test (13/16)","shard":"13/16","group":"suites"},{"name":"Test (14/16)","shard":"14/16","group":"suites"},{"name":"Test (15/16)","shard":"15/16","group":"suites"},{"name":"Test (16/16)","shard":"16/16","group":"suites"},{"name":"Corpus (1/4)","shard":"","group":"corpus","corpus_shard":"1/4"},{"name":"Corpus (2/4)","shard":"","group":"corpus","corpus_shard":"2/4"},{"name":"Corpus (3/4)","shard":"","group":"corpus","corpus_shard":"3/4"},{"name":"Corpus (4/4)","shard":"","group":"corpus","corpus_shard":"4/4"}]') }}
    env:
      UNIT_SHARD: ${{ matrix.family.shard }}
      CORPUS_SHARD: ${{ matrix.family.corpus_shard }}
      UNIT_SCOPE: ${{ matrix.family.group }}
      CI_SHARD_SEED: ${{ github.run_id }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Native unit or corpus tests
        run: make check-unit
      - name: Show verification coverage
        if: always()
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-unit-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/runtime/*.log
            build/tests/runtime/results.json
            build/tests/runtime/summary.md
            build/tests/native/**/codec-diagnostics/*.json
            build/tests/native/**/codec-diagnostics/*.log
            build/tests/corpus/*.log
            build/tests/corpus/results.json
            build/tests/corpus/summary.md
            build/tests/corpus/*/*.log
            build/tests/corpus/*/results.json
            build/tests/corpus/*/summary.md
            build/tests/pvm-asan/*.log
            build/tests/pvm-asan/results.json
            build/tests/pvm-asan/evidence/*.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Retain one stable PR gate; failed, cancelled or skipped shards must never look successful.
  # Contract group: named workloads report their own results.
  failures:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:full') }}
    name: Contract / Test (${{ matrix.shard }})
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: *ci-os
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    env:
      FAILURE_MEASURE_BUNDLES: ${{ (inputs.contract_measure_bundles || (github.event_name == 'pull_request' && github.event.label.name == 'ci:full')) && '1' || '0' }}
      FAILURE_SHARD: ${{ matrix.shard }}
      CI_SHARD_SEED: ${{ github.run_id }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Runtime failure and contract tests
        run: make check-failures
      - name: Show verification coverage
        if: always()
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-failures-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/failures/*.log
            build/tests/failures/results.json
            build/tests/failures/bundle-measurement/**/*.log
            build/ci/failure-setup.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Preserve the stable contract gate and require every partition, including specialized controls.
  # E2E group: named workloads report their own results.
  e2e:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'e2e' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:e2e' || github.event.label.name == 'ci:full')) }}
    name: E2E / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        os: *ci-os
        family:
          - {group: current, name: Current Downloads}
          - {group: mcp, name: MCP}
          - {group: telemetry, name: Telemetry}
          - {group: testnet, name: Testnet}
          - {group: transport, name: Transport}
    runs-on: ${{ matrix.os }}
    env:
      E2E_GROUP: ${{ matrix.family.group }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: E2E Networking
        if: ${{ matrix.family.group != 'mcp' }}
        run: make check-e2e
      - name: Exchange real messages with the pinned official MCP SDK
        if: ${{ matrix.family.group == 'mcp' }}
        run: make check-mcp-interop
      # Preserve protocol and failed-run evidence; exclude generated TLS keys and dependency environments.
      - name: Retain MCP end-to-end evidence
        if: ${{ always() && matrix.family.group == 'mcp' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-mcp-interop-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/mcp-interop*.log
            build/tests/mcp-interop/results.json
            build/tests/mcp-interop/*/*.jsonl
            build/tests/mcp-interop/*/peer.log
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group != 'mcp' }}
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-e2e-${{ matrix.family.group }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/e2e/*.log
            build/tests/e2e/results.json
            build/tests/e2e/startup-defaults/**/*.log
            build/tests/e2e/startup-defaults/**/results.json
            build/tests/e2e/current-download-work/**/*.log
            build/tests/e2e/current-download-work/**/*.stdout
            build/tests/e2e/current-download-work/**/*.stderr
            build/tests/e2e/telemetry*/*.log
            build/tests/e2e/offload/*.log
            build/tests/e2e/offload/resources.json
            build/tests/e2e/admission/*.log
            build/tests/e2e/admission/resources.json
            build/tests/e2e/closed-before-request/*.log
            build/tests/e2e/endpoint-soak/*.log
            build/tests/e2e/endpoint-soak/resources.json
            build/tests/e2e/mesh/*.log
            build/tests/e2e/mesh/resources.json
            build/tests/e2e/mesh-bad-pin/*.log
            build/tests/e2e/mesh-disruption/*.log
            build/tests/e2e/mesh-disruption/resources.json
            build/tests/e2e/retained-service/*.log
            build/tests/e2e/retained-service/resources.json
            build/tests/e2e/retained-integration/*.log
            build/tests/e2e/retained-integration/resources.json
            build/tests/e2e/peer-cases/**/*.log
            build/tests/e2e/tiny-devnet-*/result.json
            build/tests/e2e/tiny-devnet-*/independent/plan.json
            build/tests/e2e/tiny-devnet-*/node-*/*.log
            build/tests/e2e/tiny-devnet-*/node-*/head.json
            build/tests/e2e/rpc*/*.log
            build/tests/e2e/rpc/browser/*.log
            build/tests/e2e/rpc/browser/*.json
            build/tests/e2e/rpc/browser/*.png
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Interop group: named workloads report their own results.
  interop:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'interop' || inputs.suite == 'ref-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:interop' || github.event.label.name == 'ci:full')) }}
    name: Interop / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        os: *ci-os
        family: ${{ fromJSON(inputs.suite == 'ref-pvm' && '[{"name":"PVM","group":"pvm-reference"}]' || '[{"name":"PVM","group":"pvm-reference"},{"name":"Telemetry","group":"telemetry-interop"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Compare pinned PolkaVM and native PVM fixtures
        if: ${{ matrix.family.group == 'pvm-reference' }}
        env:
          RAGNAROK_PVM_REFERENCE_BACKEND: interpreter
        run: make check-pvm-reference
      # Retain diagnostics even if provisioning failed before results.json could be created.
      - name: Show PVM comparison summary
        if: ${{ always() && matrix.family.group == 'pvm-reference' }}
        env:
          RAGNAROK_PVM_REFERENCE_BACKEND: interpreter
        run: make summary-pvm-reference SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain PVM comparison evidence
        if: ${{ always() && matrix.family.group == 'pvm-reference' }}
        env:
          RAGNAROK_PVM_REFERENCE_BACKEND: interpreter
        uses: *upload-artifact
        with:
          name: pvm-reference-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/pvm-reference/*.log
            build/tests/pvm-reference/results.json
            build/tests/pvm-reference/summary.md
            build/tests/native/selected/pvm_*.log
            build/tests/native/preparation/selected-pvm_*.json
      - name: Build pinned collector and verify real peer events
        if: ${{ matrix.family.group == 'telemetry-interop' }}
        run: make check-telemetry-interop-ci
      # Keep diagnostics on setup/build/test failures; exclude fixture keys and dependency trees.
      - name: Retain interoperability evidence
        if: ${{ always() && matrix.family.group == 'telemetry-interop' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-telemetry-interop-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/telemetry-interop/**/*.log
            build/tests/telemetry-interop/results.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Real shared-adapter gameplay parity belongs to Interop; each native architecture must execute DOOM.
  pvm-doom-backends:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'interop' || inputs.suite == 'pvm-backends' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:interop' || github.event.label.name == 'ci:full')) }}
    name: Interop / PVM Backends (${{ matrix.family.name }})
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        family:
          - name: Linux ARM64
            arch: arm64
            os: &ubuntu-arm-version ubuntu-26.04-arm
          - name: Linux x86-64
            arch: x86_64
            os: *ubuntu-x86-version
    runs-on: ${{ matrix.family.os }}
    env:
      PVM_CI_SYSTEM: Linux
      PVM_CI_ARCH: ${{ matrix.family.arch }}
      PVM_DOOM_CALLS: ${{ inputs.pvm_doom_calls || '2' }}
    steps:
      - *checkout
      - *python
      - name: Install DOOM asset decompressor
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd
      - name: Compare continuing DOOM through CLI-selected shared backends
        run: make check-pvm-doom-backends
      - name: Show per-frame parity and first mismatch
        if: always()
        run: |
          if test -f build/tests/pvm-doom-backends/summary.md; then
            cat build/tests/pvm-doom-backends/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain bounded shared-backend receipts
        if: always()
        uses: *upload-artifact
        with:
          name: pvm-doom-backends-${{ matrix.family.arch }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/tests/native/selected/*.log
            build/tests/pvm-doom-backends/*.json
            build/tests/pvm-doom-backends/*.md
            build/tests/pvm-doom-backends/*.log
            build/tests/pvm-doom/*.json
            build/tests/pvm-doom/*.log
            build/polkavm-build.log
            build/ci/*.log

