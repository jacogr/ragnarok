# Defines CI verification and evidence collection. Exposes independently scheduled checks
# through GitHub Actions jobs using the maintained Make targets.

name: CI

# Smoke-check every PR update; heavy verification remains explicit on PRs and automatic on master.
"on":
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Verification scope
        type: choice
        options: [smoke, unit, e2e, build, docker, interop, perf, ref-pvm, fuzz, fuzz-pvm, bench-pvm, bench-doom, bench-storage, bench-storage-growth, full]
        default: full
        required: true
      pvm_prepared_baseline:
        description: Optional full commit SHA for a paired prior prepared interpreter
        type: string
        default: ""
        required: false

permissions:
  contents: read

# New requests supersede earlier runs for the same ref; unrelated labels cannot cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.state != 'open' && github.run_id || github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.action != 'labeled' && format('smoke-{0}', github.event.pull_request.number) || github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name != 'ci:unit' && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:e2e' && github.event.label.name != 'ci:interop' && github.event.label.name != 'ci:perf' && github.event.label.name != 'ci:fuzz' && github.run_id || github.ref }}
  cancel-in-progress: true

# All verification groups use the same shell and Python output policy.
defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Exercise the shipped minified JS/CSS in every native/browser verification job.
  UI_MINIFY: "1"

# Independent groups run concurrently on separate VMs; no job requires another job's artifacts.
jobs:
  # Keep PR Smoke independent; source and rejection checks share one full-CI runner.
  compile:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.action != 'labeled') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke') }}
    name: Compile / ${{ matrix.family.name }}
    timeout-minutes: &ci-job-timeout 60
    strategy:
      fail-fast: false
      matrix:
        os: &ci-os [ubuntu-latest]
        family: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full'))) && '[{"name":"Smoke","group":"smoke"},{"name":"Source","group":"modules"},{"name":"Reference & Tooling","group":"python"}]' || '[{"name":"Smoke","group":"smoke"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &python
        name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate verification inventory
        if: ${{ matrix.family.group != 'smoke' }}
        run: &inventory-run make check-inventory
      - name: Check all formatting and smoke-compile all production modules
        if: ${{ matrix.family.group == 'smoke' }}
        run: make check-smoke
      - name: Retain smoke diagnostics
        if: ${{ always() && matrix.family.group == 'smoke' }}
        uses: &upload-artifact actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/smoke/*.log
            build/tests/smoke/results.json
      - name: Compile source
        if: ${{ matrix.family.group == 'modules' }}
        run: make check-modules
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group == 'modules' }}
        run: make summary-${{ matrix.family.group }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: ${{ always() && matrix.family.group == 'modules' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-modules-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/modules/*.log
            build/tests/modules/results.json
      - name: Compile reference & tooling
        if: ${{ matrix.family.group == 'python' }}
        run: make check-python
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group == 'python' }}
        run: make summary-${{ matrix.family.group }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: ${{ always() && matrix.family.group == 'python' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-python-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/python/*.log
            build/tests/python/results.json
      - name: Compile rejection guards
        # A failed source check must not suppress the independent rejection checks.
        if: ${{ !cancelled() && matrix.family.group == 'modules' }}
        run: make check-guards
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group == 'modules' }}
        run: make summary-guards SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: ${{ always() && matrix.family.group == 'modules' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-guards-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/guards/*.log
            build/tests/guards/results.json
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log

  compile-status:
    name: Compile
    timeout-minutes: *ci-job-timeout
    needs: compile
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.action != 'labeled') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')) }}
    strategy: &os-strategy
      fail-fast: false
      matrix:
        os: *ci-os
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Compile family
        env:
          SHARDS_RESULT: ${{ needs.compile.result }}
        run: test "$SHARDS_RESULT" = success

  models:
    if: &requested ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full')) }}
    name: Model verification
    timeout-minutes: *ci-job-timeout
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Check lifecycle safety, mutants and reachability
        run: make check-models
      - name: Show verification coverage
        if: always()
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      # Retain only replayable models and diagnostics, never compiler/dependency trees.
      - name: Retain model verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-models-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/model-tools.log
            build/ci/models.log
            build/ci/setup.log
            build/tests/models/*.log
            build/tests/models/*.nif
            build/tests/models/results.json

  unit:
    if: *requested
    name: Unit / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        os: *ci-os
        family: ${{ fromJSON('[{"name":"Test (1/16)","shard":"1/16","group":"suites"},{"name":"Test (2/16)","shard":"2/16","group":"suites"},{"name":"Test (3/16)","shard":"3/16","group":"suites"},{"name":"Test (4/16)","shard":"4/16","group":"suites"},{"name":"Test (5/16)","shard":"5/16","group":"suites"},{"name":"Test (6/16)","shard":"6/16","group":"suites"},{"name":"Test (7/16)","shard":"7/16","group":"suites"},{"name":"Test (8/16)","shard":"8/16","group":"suites"},{"name":"Test (9/16)","shard":"9/16","group":"suites"},{"name":"Test (10/16)","shard":"10/16","group":"suites"},{"name":"Test (11/16)","shard":"11/16","group":"suites"},{"name":"Test (12/16)","shard":"12/16","group":"suites"},{"name":"Test (13/16)","shard":"13/16","group":"suites"},{"name":"Test (14/16)","shard":"14/16","group":"suites"},{"name":"Test (15/16)","shard":"15/16","group":"suites"},{"name":"Test (16/16)","shard":"16/16","group":"suites"},{"name":"Corpus (1/4)","shard":"","group":"corpus","corpus_shard":"1/4"},{"name":"Corpus (2/4)","shard":"","group":"corpus","corpus_shard":"2/4"},{"name":"Corpus (3/4)","shard":"","group":"corpus","corpus_shard":"3/4"},{"name":"Corpus (4/4)","shard":"","group":"corpus","corpus_shard":"4/4"},{"name":"PVM Sanitizers","shard":"","group":"pvm-asan","corpus_shard":""}]') }}
    env:
      UNIT_SHARD: ${{ matrix.family.shard }}
      CORPUS_SHARD: ${{ matrix.family.corpus_shard }}
      UNIT_SCOPE: ${{ matrix.family.group }}
      CI_SHARD_SEED: ${{ github.run_id }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Native unit or corpus tests
        if: ${{ matrix.family.group != 'pvm-asan' }}
        run: make check-unit
      - name: Qualify checked PVM execution with calibrated AddressSanitizer
        if: ${{ matrix.family.group == 'pvm-asan' }}
        run: make check-pvm-asan
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group != 'pvm-asan' }}
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-unit-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/runtime/*.log
            build/tests/runtime/results.json
            build/tests/native/**/codec-diagnostics/*.json
            build/tests/native/**/codec-diagnostics/*.log
            build/tests/corpus/*.log
            build/tests/corpus/results.json
            build/tests/corpus/*/*.log
            build/tests/corpus/*/results.json
            build/tests/pvm-asan/*.log
            build/tests/pvm-asan/results.json
            build/tests/pvm-asan/evidence/*.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Retain one stable PR gate; failed, cancelled or skipped shards must never look successful.
  unit-status:
    name: Unit
    timeout-minutes: *ci-job-timeout
    needs: unit
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Unit family
        env:
          SHARDS_RESULT: ${{ needs.unit.result }}
        run: test "$SHARDS_RESULT" = success

  failures:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:full') }}
    name: Contract / Test (${{ matrix.shard }})
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: *ci-os
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    env:
      FAILURE_SHARD: ${{ matrix.shard }}
      CI_SHARD_SEED: ${{ github.run_id }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Runtime failure and contract tests
        run: make check-failures
      - name: Show verification coverage
        if: always()
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-failures-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/failures/*.log
            build/tests/failures/results.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Preserve the stable contract gate and require every partition, including specialized controls.
  failures-status:
    name: Contract
    timeout-minutes: *ci-job-timeout
    needs: failures
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:full')) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every contract shard
        env:
          SHARDS_RESULT: ${{ needs.failures.result }}
        run: test "$SHARDS_RESULT" = success

  e2e:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'e2e' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:e2e' || github.event.label.name == 'ci:full')) }}
    name: E2E / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        os: *ci-os
        family:
          - {group: current, name: Current Downloads}
          - {group: telemetry, name: Telemetry}
          - {group: testnet, name: Testnet}
          - {group: transport, name: Transport}
    runs-on: ${{ matrix.os }}
    env:
      E2E_GROUP: ${{ matrix.family.group }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: E2E Networking
        run: make check-e2e
      - name: Show verification coverage
        if: always()
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-e2e-${{ matrix.family.group }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/e2e/*.log
            build/tests/e2e/results.json
            build/tests/e2e/current-download-work/**/*.log
            build/tests/e2e/current-download-work/**/*.stdout
            build/tests/e2e/current-download-work/**/*.stderr
            build/tests/e2e/telemetry*/*.log
            build/tests/e2e/offload/*.log
            build/tests/e2e/offload/resources.json
            build/tests/e2e/admission/*.log
            build/tests/e2e/admission/resources.json
            build/tests/e2e/closed-before-request/*.log
            build/tests/e2e/endpoint-soak/*.log
            build/tests/e2e/endpoint-soak/resources.json
            build/tests/e2e/mesh/*.log
            build/tests/e2e/mesh/resources.json
            build/tests/e2e/mesh-bad-pin/*.log
            build/tests/e2e/mesh-disruption/*.log
            build/tests/e2e/mesh-disruption/resources.json
            build/tests/e2e/retained-service/*.log
            build/tests/e2e/retained-service/resources.json
            build/tests/e2e/retained-integration/*.log
            build/tests/e2e/retained-integration/resources.json
            build/tests/e2e/peer-cases/**/*.log
            build/tests/e2e/tiny-devnet-*/result.json
            build/tests/e2e/tiny-devnet-*/independent/plan.json
            build/tests/e2e/tiny-devnet-*/node-*/*.log
            build/tests/e2e/tiny-devnet-*/node-*/head.json
            build/tests/e2e/rpc*/*.log
            build/tests/e2e/rpc/browser/*.log
            build/tests/e2e/rpc/browser/*.json
            build/tests/e2e/rpc/browser/*.png
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  e2e-status:
    name: E2E
    timeout-minutes: *ci-job-timeout
    needs: e2e
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'e2e' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:e2e' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every E2E family
        env:
          SHARDS_RESULT: ${{ needs.e2e.result }}
        run: test "$SHARDS_RESULT" = success

  # Keep Interop jobs adjacent; group requests run every implementation comparison.
  # Pinned public-API comparisons remain distinct from frozen native fixtures and future fuzzing.
  interop:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'interop' || inputs.suite == 'ref-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:interop' || github.event.label.name == 'ci:full')) }}
    name: Interop / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        os: *ci-os
        family: ${{ fromJSON(inputs.suite == 'ref-pvm' && '[{"name":"PVM","group":"pvm-reference"}]' || '[{"name":"PVM","group":"pvm-reference"},{"name":"Telemetry","group":"telemetry-interop"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Compare pinned PolkaVM and native PVM fixtures
        if: ${{ matrix.family.group == 'pvm-reference' }}
        env:
          RAGNAROK_PVM_REFERENCE_BACKEND: interpreter
        run: make check-pvm-reference
      # Retain diagnostics even if provisioning failed before results.json could be created.
      - name: Show PVM comparison summary
        if: ${{ always() && matrix.family.group == 'pvm-reference' }}
        env:
          RAGNAROK_PVM_REFERENCE_BACKEND: interpreter
        run: make summary-pvm-reference SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain PVM comparison evidence
        if: ${{ always() && matrix.family.group == 'pvm-reference' }}
        env:
          RAGNAROK_PVM_REFERENCE_BACKEND: interpreter
        uses: *upload-artifact
        with:
          name: pvm-reference-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/pvm-reference/*.log
            build/tests/pvm-reference/results.json
            build/tests/pvm-reference/summary.md
            build/tests/native/selected/pvm_*.log
            build/tests/native/preparation/selected-pvm_*.json
      - name: Build pinned collector and verify real peer events
        if: ${{ matrix.family.group == 'telemetry-interop' }}
        run: make check-telemetry-interop-ci
      # Keep diagnostics on setup/build/test failures; exclude fixture keys and dependency trees.
      - name: Retain interoperability evidence
        if: ${{ always() && matrix.family.group == 'telemetry-interop' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-telemetry-interop-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/telemetry-interop/**/*.log
            build/tests/telemetry-interop/results.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  interop-status:
    name: Interop
    timeout-minutes: *ci-job-timeout
    needs: interop
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'interop' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:interop' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Interop family
        env:
          SHARDS_RESULT: ${{ needs.interop.result }}
        run: test "$SHARDS_RESULT" = success

  build:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'build' || inputs.suite == 'docker' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:full') }}
    name: Build / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.suite == 'docker' && '[{"name":"Docker","group":"docker","os":"ubuntu-latest","platform":""}]' || '[{"name":"Docker","group":"docker","os":"ubuntu-latest","platform":""},{"name":"Linux","group":"binary","os":"ubuntu-24.04","platform":"linux-amd64"},{"name":"macOS","group":"binary","os":"macos-15","platform":"macos-arm64"}]') }}
    runs-on: ${{ matrix.family.os }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Build and smoke-test Docker image
        if: ${{ matrix.family.group == 'docker' }}
        run: make check-docker
      - name: Retain Docker build diagnostics
        if: ${{ always() && matrix.family.group == 'docker' }}
        uses: *upload-artifact
        with:
          name: docker-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/docker-build.log
            build/ci/docker-smoke.log
      - name: Build, package and smoke-test relocated peer
        if: ${{ matrix.family.group == 'binary' }}
        run: make package-binary
      - name: Retain downloadable binary archive
        if: ${{ matrix.family.group == 'binary' }}
        uses: *upload-artifact
        with:
          name: ragnarok-${{ matrix.family.platform }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/dist/ragnarok-${{ matrix.family.platform }}.tar.gz
            build/dist/ragnarok-${{ matrix.family.platform }}.tar.gz.sha256
      - name: Retain binary build diagnostics
        if: ${{ always() && matrix.family.group == 'binary' }}
        uses: *upload-artifact
        with:
          name: binary-${{ matrix.family.platform }}-diagnostics-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  build-status:
    name: Build
    timeout-minutes: *ci-job-timeout
    needs: build
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'build' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:full')) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Build family
        env:
          SHARDS_RESULT: ${{ needs.build.result }}
        run: test "$SHARDS_RESULT" = success

  perf:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'bench-pvm' || inputs.suite == 'bench-doom' || inputs.suite == 'bench-storage' || inputs.suite == 'bench-storage-growth' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full')) }}
    name: Perf / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.suite == 'bench-pvm' && '[{"name":"PVM","group":"bench-pvm"}]' || inputs.suite == 'bench-doom' && '[{"name":"PVM","group":"bench-doom"}]' || inputs.suite == 'bench-storage' && '[{"name":"Storage","group":"bench-storage"}]' || inputs.suite == 'bench-storage-growth' && '[{"name":"Storage Growth","group":"bench-storage-growth"}]' || '[{"name":"PVM","group":"bench-pvm-all"},{"name":"Storage","group":"bench-storage"},{"name":"Storage Growth","group":"bench-storage-growth"}]') }}
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Measure validated PVM workloads
        if: ${{ (matrix.family.group == 'bench-pvm' || matrix.family.group == 'bench-pvm-all') }}
        run: make bench-pvm
      - name: Measure validated real sieve
        if: ${{ (matrix.family.group == 'bench-pvm' || matrix.family.group == 'bench-pvm-all') }}
        run: make bench-pvm-sieve
      - name: Measure validated minimal, memory-fill and Pinky guests
        if: ${{ (matrix.family.group == 'bench-pvm' || matrix.family.group == 'bench-pvm-all') }}
        run: make bench-pvm-guests
      - name: Show speed comparison table
        if: ${{ always() && (matrix.family.group == 'bench-pvm' || matrix.family.group == 'bench-pvm-all') }}
        run: make summary-pvm-benchmark SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Show real-guest speed comparison tables
        if: ${{ always() && (matrix.family.group == 'bench-pvm' || matrix.family.group == 'bench-pvm-all') }}
        run: |
          for report in build/tests/pvm-sieve/summary.md build/tests/pvm-guests/summary.md; do
            # Missing reports follow a failed/skipped runner; never substitute old successful evidence.
            if test -f "$report"; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain raw benchmark evidence
        if: ${{ always() && (matrix.family.group == 'bench-pvm' || matrix.family.group == 'bench-pvm-all') }}
        uses: *upload-artifact
        with:
          name: bench-pvm-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/pvm-benchmark/*.log
            build/tests/pvm-benchmark/results.json
            build/tests/pvm-benchmark/samples.csv
            build/tests/pvm-benchmark/summary.md
            build/tests/pvm-sieve/*.log
            build/tests/pvm-sieve/results.json
            build/tests/pvm-sieve/samples.csv
            build/tests/pvm-sieve/summary.md
            build/tests/pvm-guests/results.json
            build/tests/pvm-guests/samples.csv
            build/tests/pvm-guests/summary.md
            build/tests/pvm-guests/*/*.log
            build/tests/pvm-guests/*/results.json
            build/tests/pvm-guests/*/samples.csv
            build/tests/pvm-guests/*/summary.md
            build/pvm-benchmark/native-build.log
            build/ci/*.log
      - name: Install DOOM asset decompressor
        if: ${{ !cancelled() && (matrix.family.group == 'bench-doom' || matrix.family.group == 'bench-pvm-all') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd
      - name: Compare complete DOOM calls with PolkaVM interpreted
        if: ${{ !cancelled() && (matrix.family.group == 'bench-doom' || matrix.family.group == 'bench-pvm-all') }}
        run: make bench-pvm-doom
      - name: Show DOOM initialization and gameplay CPU comparison
        if: ${{ always() && (matrix.family.group == 'bench-doom' || matrix.family.group == 'bench-pvm-all') }}
        run: |
          if test -f build/tests/pvm-doom/summary.md; then
            cat build/tests/pvm-doom/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain validated DOOM samples and source identities
        if: ${{ always() && (matrix.family.group == 'bench-doom' || matrix.family.group == 'bench-pvm-all') }}
        uses: *upload-artifact
        with:
          name: bench-doom-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/pvm-doom/*.log
            build/tests/pvm-doom/*.json
            build/tests/pvm-doom/summary.md
      - name: Compare validated memory and durable storage workloads
        if: ${{ matrix.family.group == 'bench-storage' }}
        run: make bench-storage
      - name: Measure checked storage resource panels
        if: ${{ matrix.family.group == 'bench-storage' }}
        run: make bench-storage-resources bench-storage-allocations bench-storage-lifetimes bench-storage-deployment bench-storage-fresh-reopen bench-storage-file-cache
      - name: Measure child-local storage memory ceilings
        if: ${{ matrix.family.group == 'bench-storage' }}
        run: make bench-storage-memory-ceilings
      - name: Show storage speed comparison
        if: ${{ always() && matrix.family.group == 'bench-storage' }}
        run: make summary-storage-benchmark SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Show storage resource evidence
        if: ${{ always() && matrix.family.group == 'bench-storage' }}
        run: make summary-storage-resources SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Show child-local storage memory ceilings
        if: ${{ always() && matrix.family.group == 'bench-storage' }}
        run: make summary-storage-memory-ceilings SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain storage speed evidence
        if: ${{ always() && matrix.family.group == 'bench-storage' }}
        uses: *upload-artifact
        with:
          name: bench-storage-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/storage-benchmark/*.log
            build/tests/storage-benchmark/results.json
            build/tests/storage-benchmark/samples.csv
            build/tests/storage-benchmark/summary.md
            build/tests/storage-resources/*.log
            build/tests/storage-resources/results.json
            build/tests/storage-resources/*.csv
            build/tests/storage-resources/summary.md
            build/tests/storage-allocations/*.log
            build/tests/storage-allocations/results.json
            build/tests/storage-allocations/*.csv
            build/tests/storage-allocations/summary.md
            build/tests/storage-lifetimes/*.log
            build/tests/storage-lifetimes/results.json
            build/tests/storage-lifetimes/*.csv
            build/tests/storage-lifetimes/summary.md
            build/tests/storage-deployment/*.log
            build/tests/storage-deployment/results.json
            build/tests/storage-deployment/*.csv
            build/tests/storage-deployment/summary.md
            build/tests/storage-fresh-reopen/*.log
            build/tests/storage-fresh-reopen/results.json
            build/tests/storage-fresh-reopen/*.csv
            build/tests/storage-fresh-reopen/summary.md
            build/tests/storage-file-cache/*.log
            build/tests/storage-file-cache/results.json
            build/tests/storage-file-cache/*.csv
            build/tests/storage-file-cache/summary.md
            build/tests/storage-memory-ceilings/*.log
            build/tests/storage-memory-ceilings/results.json
            build/tests/storage-memory-ceilings/observations.csv
            build/tests/storage-memory-ceilings/summary.md
            build/tests/storage-memory-ceilings/status.md
            build/tests/storage-resource-summary.md
            build/ci/*.log
      - name: Measure sustained storage growth and SDK IO
        if: ${{ matrix.family.group == 'bench-storage-growth' }}
        run: make bench-storage-growth
      - name: Show sustained storage growth
        if: ${{ always() && matrix.family.group == 'bench-storage-growth' }}
        run: make summary-storage-growth SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain sustained storage evidence
        if: ${{ always() && matrix.family.group == 'bench-storage-growth' }}
        uses: *upload-artifact
        with:
          name: bench-storage-growth-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/storage-growth-benchmark/results.json
            build/tests/storage-growth-benchmark/summary.md
            build/tests/storage-growth-benchmark/growth/*.log
            build/tests/storage-growth-benchmark/growth/results.json
            build/tests/storage-growth-benchmark/growth/samples.csv
            build/tests/storage-growth-benchmark/growth/publications.csv
            build/tests/storage-growth-benchmark/growth/io/*.log
            build/tests/storage-growth-benchmark/growth/io/results.json
            build/tests/storage-growth-benchmark/growth/io/calls.csv
            build/ci/*.log

  # Regular Perf includes the exact-master public/core/lifecycle comparison on one runner.
  pvm-comparison:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'bench-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full')) }}
    name: Perf / PVM Comparison (${{ matrix.family.name }})
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON('[{"name":"Linux ARM64","group":"arm64","os":"ubuntu-26.04-arm"},{"name":"Linux x86-64","group":"x86_64","os":"ubuntu-26.04"}]') }}
    runs-on: ${{ matrix.family.os }}
    env:
      PVM_CI_SYSTEM: Linux
      PVM_CI_ARCH: ${{ matrix.family.group }}
      PVM_COMPARE_PREPARED_BASE: ${{ inputs.pvm_prepared_baseline }}
    steps:
      - *checkout
      - *python
      - name: Resolve current master and optional prepared baseline
        if: ${{ matrix.family.group == 'x86_64' }}
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          python3 - <<'PYBASE'
          import os,re,subprocess
          baseline=os.environ.get('PVM_COMPARE_PREPARED_BASE','')
          if baseline:
              if re.fullmatch(r'[0-9a-f]{40}',baseline) is None:
                  raise ValueError('Prepared baseline must be a full lowercase commit SHA')
              subprocess.run(['git','fetch','--no-tags','origin',baseline],check=True)
          PYBASE
      - name: Install DOOM asset decompressor
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd
      - name: Qualify PVM on the native Linux architecture
        run: make check-pvm-native
      - name: Compare checked interpreters on Linux x86-64
        if: ${{ matrix.family.group == 'x86_64' }}
        run: make bench-pvm-interpreter
      - name: Compare public ARM64 JIT and checked interpreters
        if: ${{ matrix.family.group == 'arm64' }}
        run: make bench-pvm-arm64-applications
      - name: Show complete comparison
        if: always()
        run: |
          for summary in build/tests/pvm-interpreter-linux/summary.md build/tests/pvm-arm64-applications/summary.md; do
            if test -f "$summary"; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain exact-source timing and refusal evidence
        if: always()
        uses: *upload-artifact
        with:
          name: pvm-comparison-${{ matrix.family.group }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/pvm-interpreter-linux/*.json
            build/tests/pvm-interpreter-linux/*.log
            build/tests/pvm-interpreter-linux/summary.md
            build/tests/pvm-native/*.json
            build/tests/pvm-native/*.log
            build/tests/pvm-arm64-applications/*.json
            build/tests/pvm-arm64-applications/*.log
            build/tests/pvm-arm64-applications/summary.md
            build/tests/pvm-doom/*.json
            build/tests/pvm-doom/*.log
            build/ci/*.log

  perf-status:
    name: Perf
    timeout-minutes: *ci-job-timeout
    needs: [perf, pvm-comparison]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Perf family
        env:
          SHARDS_RESULT: ${{ needs.perf.result }}
          COMPARISON_RESULT: ${{ needs.pvm-comparison.result }}
        run: test "$SHARDS_RESULT" = success && test "$COMPARISON_RESULT" = success

  pvm-fuzz:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'fuzz' || inputs.suite == 'fuzz-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:fuzz' || github.event.label.name == 'ci:full')) }}
    name: Fuzz / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.suite == 'fuzz-pvm' && '[{"name":"PVM","group":"pvm"}]' || '[{"name":"PVM","group":"pvm"},{"name":"JAM (1/3)","group":"jam-interface","shard":"1/3"},{"name":"JAM (2/3)","group":"jam-interface","shard":"2/3"},{"name":"JAM (3/3)","group":"jam-interface","shard":"3/3"},{"name":"JAM Network","group":"jam-network"}]') }}
    runs-on: ubuntu-latest
    env:
      FUZZ_RUNS: "10000"
      JAM_FUZZ_SHARD: ${{ matrix.family.shard }}
      CI_SHARD_SEED: ${{ github.run_id }}
    steps:
      - *checkout
      - *python
      - name: Validate verification inventory
        run: *inventory-run
      - name: Run pinned upstream campaigns and JAM bridge
        if: matrix.family.group == 'pvm'
        run: make fuzz-pvm-upstream
      - name: Show fuzz coverage and bridge accounting
        if: always() && matrix.family.group == 'pvm'
        run: |
          if test -f build/pvm-upstream-fuzz/summary.md; then
            cat build/pvm-upstream-fuzz/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'PVM fuzz campaign did not complete; inspect results.json and logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain fuzz evidence and failing inputs
        if: always() && matrix.family.group == 'pvm'
        uses: *upload-artifact
        with:
          name: pvm-fuzz-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/pvm-upstream-fuzz/*.log
            build/pvm-upstream-fuzz/results.json
            build/pvm-upstream-fuzz/summary.md
            build/pvm-upstream-fuzz/artifacts/

      - name: Verify current JAM engine interface and whole-map STF cases
        if: matrix.family.group == 'jam-interface'
        run: make check-jam-fuzzer-interface
      - name: Show JAM interface verdict and pending engine validation
        if: always() && matrix.family.group == 'jam-interface'
        run: |
          summary="build/tests/jam-fuzzer-interface/${JAM_FUZZ_SHARD/\//-of-}/summary.md"
          if test -f "$summary"; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'JAM interface verification did not complete; live engine validation remains pending.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain JAM interface evidence
        if: always() && matrix.family.group == 'jam-interface'
        uses: *upload-artifact
        with:
          name: jam-fuzzer-interface-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/ci/*.log
            build/tests/jam-fuzzer-interface/**/*.log
            build/tests/jam-fuzzer-interface/**/results.json
            build/tests/jam-fuzzer-interface/**/summary.md

      - name: Verify issue215 JAM network target readiness
        if: matrix.family.group == 'jam-network'
        run: make check-jam-network
      - name: Show JAM network readiness and pending live campaign
        if: always() && matrix.family.group == 'jam-network'
        run: |
          if test -f build/tests/jam-network/summary.md; then
            cat build/tests/jam-network/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'JAM network target verification did not complete; live campaign remains pending.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain JAM network evidence
        if: always() && matrix.family.group == 'jam-network'
        uses: *upload-artifact
        with:
          name: jam-network-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/tests/jam-network/*.log
            build/tests/jam-network/results.json
            build/tests/jam-network/plan.json
            build/tests/jam-network/summary.md

  # Future subsystem campaigns join this aggregate so one green child cannot conceal another failure.
  fuzz-status:
    name: Fuzz
    timeout-minutes: *ci-job-timeout
    needs: [pvm-fuzz]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'fuzz' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:fuzz' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Fuzz job
        env:
          PVM_FUZZ_RESULT: ${{ needs.pvm-fuzz.result }}
        run: test "$PVM_FUZZ_RESULT" = success

  # Experimental execution-tier qualification is manual and independent of production performance gates.
