# Defines CI verification and evidence collection. Exposes independently scheduled checks
# through GitHub Actions jobs using the maintained Make targets.

name: CI

# Smoke-check every PR update; heavy verification remains explicit on PRs and automatic on master.
"on":
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Verification scope
        type: choice
        options: [smoke, tooling, unit, e2e, build, docker, interop, perf, ref-pvm, fuzz, fuzz-pvm, bench-pvm, bench-doom, pvm-backends, bench-storage, bench-storage-growth, full]
        default: full
        required: true
      contract_measure_bundles:
        description: Measure opt-in Contract bundles against standalone builds in cold caches
        type: boolean
        default: false
        required: false
      pvm_architecture:
        description: Native architecture for focused bench-pvm/bench-doom requests
        type: choice
        options: [all, arm64, x86_64]
        default: all
        required: false

      pvm_doom_calls:
        description: "Shared-backend DOOM calls (1 is a sizing pilot; 2 is the continuing check)"
        required: false
        type: choice
        default: "2"
        options: ["1", "2"]

permissions:
  contents: read

# New requests supersede earlier runs for the same ref; unrelated labels cannot cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.state != 'open' && github.run_id || github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.action != 'labeled' || github.event.label.name == 'lgtm') && format('smoke-{0}', github.event.pull_request.number) || github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name != 'ci:unit' && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:docker' && github.event.label.name != 'ci:e2e' && github.event.label.name != 'ci:interop' && github.event.label.name != 'ci:perf' && github.event.label.name != 'ci:fuzz' && github.run_id || github.ref }}
  cancel-in-progress: true

# All verification groups use the same shell and Python output policy.
defaults:
  run:
    shell: bash

env:
  # Authenticated public asset downloads use this workflow's contents-read quota.
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Exercise the shipped minified JS/CSS in every native/browser verification job.
  UI_MINIFY: "1"

# Smoke and full verification share the fixture gate before starting build jobs.
jobs:
  # A stale fixture pin stops Smoke or full verification before compilation.
  fixture-provenance:
    name: Build / Provenance
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'smoke' || inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.action != 'labeled' || github.event.label.name == 'lgtm' || github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full')) }}
    runs-on: &ubuntu-x86-version ubuntu-26.04
    timeout-minutes: 5
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &python
        name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make check-fixture-provenance

  # One Build matrix owns the fast PR gate, tooling and native packaging/checks.
  # Build group: named workloads report their own results.
  build:
    needs: fixture-provenance
    if: ${{ !cancelled() && (needs['fixture-provenance'].result == 'success' || needs['fixture-provenance'].result == 'skipped') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'smoke' || inputs.suite == 'tooling' || inputs.suite == 'unit' || inputs.suite == 'build' || inputs.suite == 'docker' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:docker' || github.event.label.name == 'ci:full' || github.event.label.name == 'lgtm')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.action != 'labeled')) }}
    name: Build / ${{ matrix.family.name }}
    timeout-minutes: &ci-job-timeout 60
    strategy:
      fail-fast: false
      matrix:
        runner:
          - x86: *ubuntu-x86-version
            arm: &ubuntu-arm-version ubuntu-26.04-arm
        family: >-
          ${{ fromJSON(
            inputs.suite == 'tooling' && '[{"name":"Tooling","group":"python","platform":""}]'
            || (inputs.suite == 'docker' || github.event.label.name == 'ci:docker') && '[{"name":"Docker","group":"docker","platform":""}]'
            || (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:full')) && '[{"name":"Smoke","group":"smoke","platform":""},{"name":"Tooling","group":"python","platform":""},{"name":"Linux x86-64","group":"binary","platform":"linux-amd64"},{"name":"Linux ARM64","group":"binary","platform":"linux-arm64"},{"name":"macOS ARM64","group":"binary","os":"macos-15","platform":"macos-arm64"},{"name":"Docker","group":"docker","platform":""}]'
            || ((github.event_name == 'workflow_dispatch' && inputs.suite == 'unit') || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:unit')) && '[{"name":"Smoke","group":"smoke","platform":""},{"name":"Tooling","group":"python","platform":""},{"name":"Linux Checks","group":"checks","platform":"linux-amd64"}]'
            || inputs.suite == 'build' && '[{"name":"Linux x86-64","group":"binary","platform":"linux-amd64"},{"name":"Linux ARM64","group":"binary","platform":"linux-arm64"},{"name":"macOS ARM64","group":"binary","os":"macos-15","platform":"macos-arm64"},{"name":"Docker","group":"docker","platform":""}]'
            || '[{"name":"Smoke","group":"smoke","platform":""}]'
          ) }}
    runs-on: ${{ matrix.family.os || (matrix.family.platform == 'linux-arm64' && matrix.runner.arm || matrix.runner.x86) }}
    steps:
      - *checkout
      - *python
      # Cache only public download inputs; normal Make setup still verifies and prepares them.
      - &tool-download-cache
        name: Cache pinned compiler archives
        if: ${{ matrix.family.group != 'docker' }}
        continue-on-error: true
        uses: &cache-action actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env: &cache-timeout
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: |
            build-tools/toolchain/*.archive
          key: compiler-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('spec/toolchain.json') }}
      - &model-download-cache
        name: Cache pinned model-tool sources
        if: ${{ matrix.family.group != 'docker' && matrix.family.group != 'smoke' }}
        continue-on-error: true
        uses: *cache-action
        env: *cache-timeout
        with:
          path: build-tools/model-tools/*.archive
          key: model-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('spec/model-tools.json') }}
      - &cargo-download-cache
        name: Cache Cargo dependency downloads
        if: ${{ matrix.family.group != 'docker' && matrix.family.group != 'smoke' }}
        continue-on-error: true
        uses: *cache-action
        env: *cache-timeout
        with:
          # Do not cache Cargo credentials/configuration, installed executables or target outputs.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/Cargo.lock', 'spec/bandersnatch-pins.json', 'spec/polkavm-pins.json', '.gitmodules') }}
      - &built-cache-host
        name: Identify built dependency environment
        id: built_cache_host
        if: ${{ matrix.family.group != 'docker' && matrix.family.group != 'smoke' }}
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import hashlib, json, os, platform, shutil, subprocess
          # Generated build metadata embeds workspace/tool paths; never restore across host images.
          tools = {}
          for name in ('clang', 'clang++', 'gcc', 'cmake'):
              path = shutil.which(name)
              tools[name] = [path, subprocess.check_output([path, '--version'], text=True)] if path else None
          flags = {name: os.environ.get(name) for name in (
              'CC', 'CXX', 'AR', 'CFLAGS', 'CPPFLAGS', 'CXXFLAGS', 'LDFLAGS', 'RUSTFLAGS',
              'RUSTC', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'CARGO_ENCODED_RUSTFLAGS',
              'CARGO_BUILD_RUSTFLAGS', 'CARGO_BUILD_TARGET', 'RUSTUP_TOOLCHAIN', 'SDKROOT',
              'MACOSX_DEPLOYMENT_TARGET', 'CMAKE_GENERATOR')}
          host = [os.environ.get('ImageOS'), os.environ.get('ImageVersion'), os.getcwd(), flags,
                  platform.system(), platform.machine(), platform.release(), platform.version(), tools]
          print('key=' + hashlib.sha256(json.dumps(host, sort_keys=True).encode()).hexdigest())
          PYCODE
      - &model-built-cache
        name: Cache built model checker
        if: ${{ matrix.family.group != 'docker' && matrix.family.group != 'smoke' }}
        continue-on-error: true
        uses: *cache-action
        env: *cache-timeout
        with:
          path: |
            build-tools/model-tools/bin/tlanif
            build-tools/model-tools/environment.json
          key: model-built-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.built_cache_host.outputs.key }}-${{ hashFiles('spec/model-tools.json', 'spec/toolchain.json', 'tools/setup_tlanif.py', 'tools/managed_tools.py') }}
      - &crypto-built-cache
        name: Cache built cryptographic dependencies
        if: ${{ matrix.family.group != 'docker' && matrix.family.group != 'smoke' }}
        continue-on-error: true
        uses: *cache-action
        env: *cache-timeout
        with:
          # Rust adapter tests still run, so retain their compiled dependencies and test executables.
          path: |
            build-tools/bandersnatch/native-environment.json
            build-tools/bandersnatch/target/release
            build-tools/crypto/native-environment.json
            build-tools/crypto/*.so
            build-tools/crypto/*.dylib
          key: crypto-built-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.built_cache_host.outputs.key }}-${{ hashFiles('spec/bandersnatch-pins.json', 'spec/crypto-pins.json', 'native/bandersnatch/**', 'native/crypto/**', 'tools/build_bandersnatch.py', 'tools/build_crypto.py', 'tools/managed_tools.py', 'tools/native_dependencies.py') }}
      - &quic-built-cache
        name: Cache built QUIC dependency
        if: ${{ matrix.family.group != 'docker' && matrix.family.group != 'smoke' }}
        continue-on-error: true
        uses: *cache-action
        env: *cache-timeout
        with:
          # Only the verified ABI and receipt: pristine sources and LSQUIC patch staging stay fresh.
          path: |
            build-tools/quic/native-environment.json
            build-tools/quic/*.so
            build-tools/quic/*.dylib
          key: quic-built-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.built_cache_host.outputs.key }}-${{ hashFiles('spec/quic-proof-pins.json', 'native/quic/**', 'tools/build_quic.py', 'tools/managed_tools.py', 'tools/native_dependencies.py') }}
      - &polkavm-built-cache
        name: Cache built optional PolkaVM dependency
        if: ${{ matrix.family.group != 'docker' && matrix.family.group != 'smoke' }}
        continue-on-error: true
        uses: *cache-action
        env: *cache-timeout
        with:
          path: |
            build-tools/polkavm/native-environment.json
            build-tools/polkavm/release
          key: polkavm-built-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.built_cache_host.outputs.key }}-${{ hashFiles('spec/polkavm-pins.json', 'spec/bandersnatch-pins.json', 'native/polkavm/**', 'tools/build_polkavm.py', 'tools/managed_tools.py', 'tools/native_dependencies.py') }}
      - name: Validate verification inventory
        if: ${{ matrix.family.group != 'smoke' }}
        run: &inventory-run make check-inventory
      - name: Check all formatting and smoke-compile all production modules
        if: ${{ matrix.family.group == 'smoke' }}
        run: make check-smoke
      - name: Retain smoke diagnostics
        if: ${{ always() && matrix.family.group == 'smoke' }}
        uses: &upload-artifact actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/smoke/*.log
            build/tests/smoke/results.json
      - name: Check references and tooling
        if: ${{ matrix.family.group == 'python' }}
        run: make check-python
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group == 'python' }}
        run: make summary-${{ matrix.family.group }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: ${{ always() && matrix.family.group == 'python' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.family.os || matrix.runner.x86 }}-python-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/python/*.log
            build/tests/python/results.json
      - name: Check lifecycle safety, mutants and reachability
        if: ${{ !cancelled() && matrix.family.group == 'python' }}
        run: make check-models
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group == 'python' }}
        run: make summary-models SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      # Retain only replayable models and diagnostics, never compiler/dependency trees.
      - name: Retain model verification evidence
        if: ${{ always() && matrix.family.group == 'python' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.family.os || matrix.runner.x86 }}-models-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/model-tools.log
            build/ci/models.log
            build/ci/setup.log
            build/tests/models/*.log
            build/tests/models/*.nif
            build/tests/models/results.json
      - name: Check compiler rejection guards
        # Earlier tooling/model failures must not suppress the independent rejection checks.
        if: ${{ !cancelled() && matrix.family.group == 'python' }}
        run: make check-guards
      - name: Show verification coverage
        if: ${{ always() && matrix.family.group == 'python' }}
        run: make summary-guards SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: ${{ always() && matrix.family.group == 'python' }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.family.os || matrix.runner.x86 }}-guards-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/guards/*.log
            build/tests/guards/results.json
            build/ci/native/bandersnatch/build.log
            build/ci/native/bandersnatch/cargo-features.log
      - name: Build, package and smoke-test relocated peer
        if: ${{ matrix.family.group == 'binary' }}
        run: make package-binary
      - name: Retain downloadable binary archive
        if: ${{ matrix.family.group == 'binary' }}
        uses: *upload-artifact
        with:
          name: ragnarok-${{ matrix.family.platform }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/dist/ragnarok-${{ matrix.family.platform }}.tar.gz
            build/dist/ragnarok-${{ matrix.family.platform }}.tar.gz.sha256
      - name: Retain binary build diagnostics
        if: ${{ always() && matrix.family.group == 'binary' }}
        uses: *upload-artifact
        with:
          name: binary-${{ matrix.family.platform }}-diagnostics-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/ci/native/crypto/build.log
            build/ci/native/bandersnatch/build.log
            build/ci/native/bandersnatch/cargo-features.log
            build/ci/native/quic/build.log
      - name: Check every production module in release mode
        if: ${{ !cancelled() && (matrix.family.group == 'checks' || (matrix.family.group == 'binary' && matrix.family.platform == 'linux-amd64')) }}
        run: make check-modules
      - name: Show verification coverage
        if: ${{ always() && (matrix.family.group == 'checks' || (matrix.family.group == 'binary' && matrix.family.platform == 'linux-amd64')) }}
        run: make summary-modules SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: ${{ always() && (matrix.family.group == 'checks' || (matrix.family.group == 'binary' && matrix.family.platform == 'linux-amd64')) }}
        uses: *upload-artifact
        with:
          name: ${{ matrix.family.os || matrix.runner.x86 }}-modules-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/modules/*.log
            build/tests/modules/results.json
      # The container owns an independent image build and runtime smoke checks.
      - name: Build and smoke-test Docker image
        if: ${{ !cancelled() && matrix.family.group == 'docker' }}
        run: make check-docker
      - name: Retain Docker build diagnostics
        if: ${{ always() && matrix.family.group == 'docker' }}
        uses: *upload-artifact
        with:
          name: docker-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/docker-build.log
            build/ci/docker-smoke.log

  # Unit group: named workloads report their own results.
  unit:
    needs: fixture-provenance
    if: &requested ${{ !cancelled() && (needs['fixture-provenance'].result == 'success' || needs['fixture-provenance'].result == 'skipped') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full'))) }}
    name: Unit / ${{ matrix.family.name }}
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        os: &ci-os [*ubuntu-x86-version]
        family: ${{ fromJSON('[{"name":"Test (1/16)","shard":"1/16","group":"suites"},{"name":"Test (2/16)","shard":"2/16","group":"suites"},{"name":"Test (3/16)","shard":"3/16","group":"suites"},{"name":"Test (4/16)","shard":"4/16","group":"suites"},{"name":"Test (5/16)","shard":"5/16","group":"suites"},{"name":"Test (6/16)","shard":"6/16","group":"suites"},{"name":"Test (7/16)","shard":"7/16","group":"suites"},{"name":"Test (8/16)","shard":"8/16","group":"suites"},{"name":"Test (9/16)","shard":"9/16","group":"suites"},{"name":"Test (10/16)","shard":"10/16","group":"suites"},{"name":"Test (11/16)","shard":"11/16","group":"suites"},{"name":"Test (12/16)","shard":"12/16","group":"suites"},{"name":"Test (13/16)","shard":"13/16","group":"suites"},{"name":"Test (14/16)","shard":"14/16","group":"suites"},{"name":"Test (15/16)","shard":"15/16","group":"suites"},{"name":"Test (16/16)","shard":"16/16","group":"suites"},{"name":"Corpus (1/4)","shard":"","group":"corpus","corpus_shard":"1/4"},{"name":"Corpus (2/4)","shard":"","group":"corpus","corpus_shard":"2/4"},{"name":"Corpus (3/4)","shard":"","group":"corpus","corpus_shard":"3/4"},{"name":"Corpus (4/4)","shard":"","group":"corpus","corpus_shard":"4/4"}]') }}
    env:
      UNIT_SHARD: ${{ matrix.family.shard }}
      CORPUS_SHARD: ${{ matrix.family.corpus_shard }}
      UNIT_SCOPE: ${{ matrix.family.group }}
      CI_SHARD_SEED: ${{ github.run_id }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *tool-download-cache
      - *model-download-cache
      - *cargo-download-cache
      - *built-cache-host
      - *model-built-cache
      - *crypto-built-cache
      - *quic-built-cache
      - *polkavm-built-cache
      - name: Validate verification inventory
        run: *inventory-run
      - name: Native unit or corpus tests
        run: make check-unit
      - name: Show verification coverage
        if: always()
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-unit-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/runtime/*.log
            build/tests/runtime/results.json
            build/tests/runtime/summary.md
            build/tests/native/**/codec-diagnostics/*.json
            build/tests/native/**/codec-diagnostics/*.log
            build/tests/corpus/*.log
            build/tests/corpus/results.json
            build/tests/corpus/summary.md
            build/tests/corpus/*/*.log
            build/tests/corpus/*/results.json
            build/tests/corpus/*/summary.md
            build/tests/pvm-asan/*.log
            build/tests/pvm-asan/results.json
            build/tests/pvm-asan/evidence/*.json
            build/ci/native/crypto/build.log
            build/ci/native/bandersnatch/build.log
            build/ci/native/bandersnatch/cargo-features.log
            build/ci/native/quic/build.log

  # The standard unit shards run on x86-64. Exercise the ARM-only witness on its actual ABI.
  unit-pvm-arm64:
    needs: fixture-provenance
    if: *requested
    name: Unit / PVM auxiliary loop (ARM64)
    runs-on: *ubuntu-arm-version
    timeout-minutes: *ci-job-timeout
    steps:
      - *checkout
      - *python
      - *tool-download-cache
      - name: Execute the ARM64 auxiliary loop witness
        run: make unit SUITE=pvm_aux_loop_arm
      - name: Retain ARM64 witness evidence
        if: always()
        uses: *upload-artifact
        with:
          name: pvm-auxiliary-arm64-unit-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/native/selected/*.log

  # Retain one stable PR gate; failed, cancelled or skipped shards must never look successful.
  # Contract group: named workloads report their own results.
  failures:
    needs: fixture-provenance
    if: ${{ !cancelled() && (needs['fixture-provenance'].result == 'success' || needs['fixture-provenance'].result == 'skipped') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.label.name == 'ci:full')) }}
    name: Contract / Test (${{ matrix.shard }})
    timeout-minutes: *ci-job-timeout
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: *ci-os
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    env:
      FAILURE_MEASURE_BUNDLES: ${{ (inputs.contract_measure_bundles || (github.event_name == 'pull_request' && github.event.label.name == 'ci:full')) && '1' || '0' }}
      FAILURE_SHARD: ${{ matrix.shard }}
      CI_SHARD_SEED: ${{ github.run_id }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *tool-download-cache
      - *model-download-cache
      - *cargo-download-cache
      - *built-cache-host
      - *model-built-cache
      - *crypto-built-cache
      - *quic-built-cache
      - *polkavm-built-cache
      - name: Validate verification inventory
        run: *inventory-run
