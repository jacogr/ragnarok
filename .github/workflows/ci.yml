# Private diagnostic branch only. Never merge this workflow into PVM source PRs.
name: Private paired DOOM layers

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: Exact root-inspected private attempt manifest SHA256
        required: true
        type: string

permissions:
  contents: read

jobs:
  paired-doom:
    name: Diagnostic / DOOM layers (Linux ARM64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PVM_CI_SYSTEM: Linux
      PVM_CI_ARCH: arm64
      PVM_CI_JOB_NAME: Diagnostic / DOOM layers (Linux ARM64)
      PVM_DIAGNOSTIC_APPROVED_MANIFEST: ${{ inputs.manifest_sha256 }}
    steps:
      - name: Check out diagnostic ancestry and all four immutable source variants
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Inspect the sealed source and attempt contract before provisioning
        run: |
          set -euo pipefail
          mkdir -p build/ci
          python3 .github/diagnostics/pvm_doom_layers.py --inspect | tee build/ci/doom-layer-inspect.log
      - name: Prepare only the pinned compiler and DOOM reference dependencies
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee build/ci/doom-layer-apt-update.log
          sudo apt-get install --yes --no-install-recommends zstd 2>&1 | tee build/ci/doom-layer-apt.log
          make compiler-tools rust-tools 2>&1 | tee build/ci/doom-layer-tools.log
          python3 tools/setup_submodules.py vendor/polkavm 2>&1 | tee build/ci/doom-layer-sources.log
          doom_rust_pin="$(python3 -c 'import json; print(json.load(open("spec/bandersnatch-pins.json"))["rust"])')"
          rustup run "$doom_rust_pin" cargo fetch --locked --manifest-path tests/performance/polkavm_doom/Cargo.toml 2>&1 | tee build/ci/doom-layer-cargo.log
      - name: Run the single frozen paired diagnostic after source and deterministic-build gates
        run: |
          set -euo pipefail
          python3 .github/diagnostics/pvm_doom_layers.py --run 2>&1 | tee build/ci/doom-layer-run.log
      - name: Retain every image, source seal, raw control, timing row and first failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pvm-doom-layer-diagnostic-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          path: |
            build/pvm-doom-layer-diagnostic/
            build/ci/doom-layer-*.log
            .github/diagnostics/pvm_doom_layers.json
            .github/diagnostics/pvm_doom_layers.py
