# Defines CI verification and evidence collection. Exposes independently scheduled checks
# through GitHub Actions jobs using the maintained Make targets.

name: CI

# Smoke-check every PR update; heavy verification remains explicit on PRs and automatic on master.
"on":
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Verification scope
        type: choice
        options: [smoke, unit, e2e, build, docker, interop, perf, ref-pvm, fuzz, fuzz-pvm, bench-pvm, bench-storage, bench-storage-growth, full]
        default: full
        required: true

permissions:
  contents: read

# New requests supersede earlier runs for the same ref; unrelated labels cannot cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && format('smoke-{0}', github.event.pull_request.number) || github.event_name == 'pull_request' && github.event.label.name != 'ci:unit' && github.event.label.name != 'ci:full' && github.event.label.name != 'ci:e2e' && github.event.label.name != 'ci:interop' && github.event.label.name != 'ci:perf' && github.event.label.name != 'ci:fuzz' && github.run_id || github.ref }}
  cancel-in-progress: true

# All verification groups use the same shell and Python output policy.
defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Exercise the shipped minified JS/CSS in every native/browser verification job.
  UI_MINIFY: "1"

# Independent groups run concurrently on separate VMs; no job requires another job's artifacts.
jobs:
  # Complete source import graph plus peer main and read-only formatting; no native linking or fixture setup.
  smoke:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'labeled') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke') }}
    name: Smoke
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &python
        name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check all formatting and smoke-compile all production modules
        run: make check-smoke
      - name: Retain smoke diagnostics
        if: always()
        uses: &upload-artifact actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/smoke/*.log
            build/tests/smoke/results.json

  modules:
    if: &requested ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full')) }}
    name: Compile / Source
    timeout-minutes: 30
    strategy: &os-strategy
      fail-fast: false
      matrix:
        os: &ci-os [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      # Fail missing or inconsistent verification inputs before any native setup.
      - &inventory
        name: Validate verification inventory
        run: make check-inventory
      - name: Compile source
        run: make check-modules
      - &summary
        name: Show verification coverage
        if: always()
        run: make summary-${{ github.job }} SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-modules-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/modules/*.log
            build/tests/modules/results.json

  python:
    if: *requested
    name: Compile / Reference & Tooling
    timeout-minutes: 15
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Compile reference & tooling
        run: make check-python
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-python-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/python/*.log
            build/tests/python/results.json

  guards:
    if: *requested
    name: Compile / Rejection Guards
    timeout-minutes: 30
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Compile rejection guards
        run: make check-guards
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-guards-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/guards/*.log
            build/tests/guards/results.json
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log

  # Require the whole requested group, including failed, cancelled or skipped children.
  compile-status:
    name: Compile
    needs: [modules, python, guards]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Compile job
        env:
          MODULES_RESULT: ${{ needs.modules.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          GUARDS_RESULT: ${{ needs.guards.result }}
        run: test "$MODULES_RESULT" = success && test "$PYTHON_RESULT" = success && test "$GUARDS_RESULT" = success

  models:
    if: *requested
    name: Model verification
    timeout-minutes: 15
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Check lifecycle safety, mutants and reachability
        run: make check-models
      - *summary
      # Retain only replayable models and diagnostics, never compiler/dependency trees.
      - name: Retain model verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-models-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/model-tools.log
            build/ci/models.log
            build/ci/setup.log
            build/tests/models/*.log
            build/tests/models/*.nif
            build/tests/models/results.json

  unit:
    if: *requested
    name: Unit / Shard (${{ matrix.shard }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        os: *ci-os
        shard: ["1/16", "2/16", "3/16", "4/16", "5/16", "6/16", "7/16", "8/16", "9/16", "10/16", "11/16", "12/16", "13/16", "14/16", "15/16", "16/16"]
    env:
      UNIT_SHARD: ${{ matrix.shard }}
      CI_SHARD_SEED: ${{ github.run_id }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Native unit and codec tests
        run: make check-unit
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-unit-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/runtime/*.log
            build/tests/runtime/results.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Retain one stable PR gate; failed, cancelled or skipped shards must never look successful.
  unit-status:
    name: Unit
    needs: unit
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'unit' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:unit' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every unit shard
        env:
          SHARDS_RESULT: ${{ needs.unit.result }}
        run: test "$SHARDS_RESULT" = success

  failures:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.label.name == 'ci:full') }}
    name: Contract / Shard (${{ matrix.shard }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: *ci-os
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    env:
      FAILURE_SHARD: ${{ matrix.shard }}
      CI_SHARD_SEED: ${{ github.run_id }}
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Runtime failure and contract tests
        run: make check-failures
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-failures-${{ strategy.job-index }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/failures/*.log
            build/tests/failures/results.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Preserve the stable contract gate and require every partition, including specialized controls.
  failures-status:
    name: Contract
    needs: failures
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.label.name == 'ci:full')) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every contract shard
        env:
          SHARDS_RESULT: ${{ needs.failures.result }}
        run: test "$SHARDS_RESULT" = success

  e2e:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'e2e' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:e2e' || github.event.label.name == 'ci:full')) }}
    name: E2E / ${{ matrix.family.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: *ci-os
        family:
          - {group: application, name: Application}
          - {group: current, name: Current Downloads}
          - {group: offload, name: Offload}
          - {group: telemetry, name: Telemetry}
          - {group: transport, name: Transport}
    runs-on: ${{ matrix.os }}
    env:
      E2E_GROUP: ${{ matrix.family.group }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: E2E Networking
        run: make check-e2e
      - *summary
      # Diagnostics only: never binaries, dependency trees, certificates or private keys.
      - name: Retain verification evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-e2e-${{ matrix.family.group }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/e2e/*.log
            build/tests/e2e/results.json
            build/tests/e2e/telemetry*/*.log
            build/tests/e2e/offload/*.log
            build/tests/e2e/offload/resources.json
            build/tests/e2e/admission/*.log
            build/tests/e2e/admission/resources.json
            build/tests/e2e/closed-before-request/*.log
            build/tests/e2e/endpoint-soak/*.log
            build/tests/e2e/endpoint-soak/resources.json
            build/tests/e2e/mesh/*.log
            build/tests/e2e/mesh/resources.json
            build/tests/e2e/mesh-bad-pin/*.log
            build/tests/e2e/mesh-disruption/*.log
            build/tests/e2e/mesh-disruption/resources.json
            build/tests/e2e/retained-service/*.log
            build/tests/e2e/retained-service/resources.json
            build/tests/e2e/retained-integration/*.log
            build/tests/e2e/retained-integration/resources.json
            build/tests/e2e/peer-cases/**/*.log
            build/tests/e2e/rpc/browser/*.log
            build/tests/e2e/rpc/browser/*.json
            build/tests/e2e/rpc/browser/*.png
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  e2e-status:
    name: E2E
    needs: e2e
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'e2e' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:e2e' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every E2E family
        env:
          SHARDS_RESULT: ${{ needs.e2e.result }}
        run: test "$SHARDS_RESULT" = success

  # Keep Interop jobs adjacent; group requests run every implementation comparison.
  # Pinned public-API comparisons remain distinct from frozen native fixtures and future fuzzing.
  pvm-reference:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'interop' || inputs.suite == 'ref-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:interop' || github.event.label.name == 'ci:full')) }}
    name: Interop / PVM
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      RAGNAROK_PVM_REFERENCE_BACKEND: interpreter
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Compare pinned PolkaVM and native PVM fixtures
        run: make check-pvm-reference
      # Retain diagnostics even if provisioning failed before results.json could be created.
      - name: Show PVM comparison summary
        if: always()
        run: make summary-pvm-reference SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain PVM comparison evidence
        if: always()
        uses: *upload-artifact
        with:
          name: pvm-reference-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/pvm-reference/*.log
            build/tests/pvm-reference/results.json
            build/tests/pvm-reference/summary.md
            build/tests/native/selected/pvm_*.log
            build/tests/native/preparation/selected-pvm_*.json

  telemetry-interop:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'interop' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:interop' || github.event.label.name == 'ci:full')) }}
    name: Interop / Telemetry
    timeout-minutes: 60
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Build pinned collector and verify real peer events
        run: make check-telemetry-interop-ci
      # Keep diagnostics on setup/build/test failures; exclude fixture keys and dependency trees.
      - name: Retain interoperability evidence
        if: always()
        uses: *upload-artifact
        with:
          name: ${{ matrix.os }}-telemetry-interop-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/telemetry-interop/**/*.log
            build/tests/telemetry-interop/results.json
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # Require the whole requested group, including failed, cancelled or skipped children.
  interop-status:
    name: Interop
    needs: [pvm-reference, telemetry-interop]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'interop' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:interop' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Interop job
        env:
          PVM_REFERENCE_RESULT: ${{ needs.pvm-reference.result }}
          TELEMETRY_INTEROP_RESULT: ${{ needs.telemetry-interop.result }}
        run: test "$PVM_REFERENCE_RESULT" = success && test "$TELEMETRY_INTEROP_RESULT" = success

  # Build locally and execute the final image; no registry credentials or image publishing.
  docker:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'build' || inputs.suite == 'docker' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.label.name == 'ci:full') }}
    name: Build / Docker
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Build and smoke-test Docker image
        run: make check-docker
      - name: Retain Docker build diagnostics
        if: always()
        uses: *upload-artifact
        with:
          name: docker-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/docker-build.log
            build/ci/docker-smoke.log

  # Build only the host families with pinned compiler distributions and maintained native ABIs.
  binary:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'build' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.label.name == 'ci:full') }}
    name: Build / ${{ matrix.target.name }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: ubuntu-24.04, name: Linux, platform: linux-amd64}
          - {os: macos-15, name: macOS, platform: macos-arm64}
    runs-on: ${{ matrix.target.os }}
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Build, package and smoke-test relocated peer
        run: make package-binary
      - name: Retain downloadable binary archive
        uses: *upload-artifact
        with:
          name: ragnarok-${{ matrix.target.platform }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/dist/ragnarok-${{ matrix.target.platform }}.tar.gz
            build/dist/ragnarok-${{ matrix.target.platform }}.tar.gz.sha256
      - name: Retain binary build diagnostics
        if: always()
        uses: *upload-artifact
        with:
          name: binary-${{ matrix.target.platform }}-diagnostics-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/quic/build.log

  # A complete Build request requires the image and both native binary archives.
  build-status:
    name: Build
    needs: [docker, binary]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'build' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && github.event.label.name == 'ci:full')) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Build job
        env:
          DOCKER_RESULT: ${{ needs.docker.result }}
          BINARY_RESULT: ${{ needs.binary.result }}
        run: test "$DOCKER_RESULT" = success && test "$BINARY_RESULT" = success

  # Perf jobs publish validated measurements on master pushes and explicit group/full requests.
  bench-pvm:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'bench-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full')) }}
    name: Perf / PVM
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Measure validated PVM workloads
        run: make bench-pvm
      - name: Measure validated real sieve
        run: make bench-pvm-sieve
      - name: Measure validated minimal, memory-fill and Pinky guests
        run: make bench-pvm-guests
      - name: Show speed comparison table
        if: always()
        run: make summary-pvm-benchmark SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Show real-guest speed comparison tables
        if: always()
        run: |
          for report in build/tests/pvm-sieve/summary.md build/tests/pvm-guests/summary.md; do
            # Missing reports follow a failed/skipped runner; never substitute old successful evidence.
            if test -f "$report"; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain raw benchmark evidence
        if: always()
        uses: *upload-artifact
        with:
          name: bench-pvm-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/pvm-benchmark/*.log
            build/tests/pvm-benchmark/results.json
            build/tests/pvm-benchmark/samples.csv
            build/tests/pvm-benchmark/summary.md
            build/tests/pvm-sieve/*.log
            build/tests/pvm-sieve/results.json
            build/tests/pvm-sieve/samples.csv
            build/tests/pvm-sieve/summary.md
            build/tests/pvm-guests/results.json
            build/tests/pvm-guests/samples.csv
            build/tests/pvm-guests/summary.md
            build/tests/pvm-guests/*/*.log
            build/tests/pvm-guests/*/results.json
            build/tests/pvm-guests/*/samples.csv
            build/tests/pvm-guests/*/summary.md
            build/pvm-benchmark/native-build.log
            build/ci/*.log

  # Keep storage adjacent to other Perf jobs and use the same group/full request policy.
  bench-storage:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'bench-storage' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full')) }}
    name: Perf / Storage
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Compare validated memory and durable storage workloads
        run: make bench-storage
      - name: Measure checked storage resource panels
        run: make bench-storage-resources bench-storage-allocations bench-storage-lifetimes bench-storage-deployment bench-storage-fresh-reopen bench-storage-file-cache
      - name: Measure child-local storage memory ceilings
        run: make bench-storage-memory-ceilings
      - name: Show storage speed comparison
        if: always()
        run: make summary-storage-benchmark SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Show storage resource evidence
        if: always()
        run: make summary-storage-resources SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Show child-local storage memory ceilings
        if: always()
        run: make summary-storage-memory-ceilings SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain storage speed evidence
        if: always()
        uses: *upload-artifact
        with:
          name: bench-storage-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/storage-benchmark/*.log
            build/tests/storage-benchmark/results.json
            build/tests/storage-benchmark/samples.csv
            build/tests/storage-benchmark/summary.md
            build/tests/storage-resources/*.log
            build/tests/storage-resources/results.json
            build/tests/storage-resources/*.csv
            build/tests/storage-resources/summary.md
            build/tests/storage-allocations/*.log
            build/tests/storage-allocations/results.json
            build/tests/storage-allocations/*.csv
            build/tests/storage-allocations/summary.md
            build/tests/storage-lifetimes/*.log
            build/tests/storage-lifetimes/results.json
            build/tests/storage-lifetimes/*.csv
            build/tests/storage-lifetimes/summary.md
            build/tests/storage-deployment/*.log
            build/tests/storage-deployment/results.json
            build/tests/storage-deployment/*.csv
            build/tests/storage-deployment/summary.md
            build/tests/storage-fresh-reopen/*.log
            build/tests/storage-fresh-reopen/results.json
            build/tests/storage-fresh-reopen/*.csv
            build/tests/storage-fresh-reopen/summary.md
            build/tests/storage-file-cache/*.log
            build/tests/storage-file-cache/results.json
            build/tests/storage-file-cache/*.csv
            build/tests/storage-file-cache/summary.md
            build/tests/storage-memory-ceilings/*.log
            build/tests/storage-memory-ceilings/results.json
            build/tests/storage-memory-ceilings/observations.csv
            build/tests/storage-memory-ceilings/summary.md
            build/tests/storage-memory-ceilings/status.md
            build/tests/storage-resource-summary.md
            build/ci/*.log

  # Sustained growth keeps all repetitions on its own runner, independent of other storage panels.
  bench-storage-growth:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'bench-storage-growth' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full')) }}
    name: Perf / Storage Growth
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Measure sustained storage growth and SDK IO
        run: make bench-storage-growth
      - name: Show sustained storage growth
        if: always()
        run: make summary-storage-growth SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain sustained storage evidence
        if: always()
        uses: *upload-artifact
        with:
          name: bench-storage-growth-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            build/tests/storage-growth-benchmark/results.json
            build/tests/storage-growth-benchmark/summary.md
            build/tests/storage-growth-benchmark/growth/*.log
            build/tests/storage-growth-benchmark/growth/results.json
            build/tests/storage-growth-benchmark/growth/samples.csv
            build/tests/storage-growth-benchmark/growth/publications.csv
            build/tests/storage-growth-benchmark/growth/io/*.log
            build/tests/storage-growth-benchmark/growth/io/results.json
            build/tests/storage-growth-benchmark/growth/io/calls.csv
            build/ci/*.log

  # Require the whole requested group, including failed, cancelled or skipped children.
  perf-status:
    name: Perf
    needs: [bench-pvm, bench-storage, bench-storage-growth]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'perf' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:perf' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Perf job
        env:
          BENCH_PVM_RESULT: ${{ needs.bench-pvm.result }}
          BENCH_STORAGE_RESULT: ${{ needs.bench-storage.result }}
          BENCH_STORAGE_GROWTH_RESULT: ${{ needs.bench-storage-growth.result }}
        run: test "$BENCH_PVM_RESULT" = success && test "$BENCH_STORAGE_RESULT" = success && test "$BENCH_STORAGE_GROWTH_RESULT" = success

  # Original upstream campaigns and the JAM bridge have separate verdicts and failure artifacts.
  pvm-fuzz:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'fuzz' || inputs.suite == 'fuzz-pvm' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:fuzz' || github.event.label.name == 'ci:full')) }}
    name: Fuzz / PVM
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      FUZZ_RUNS: "10000"
    steps:
      - *checkout
      - *python
      - *inventory
      - name: Run pinned upstream campaigns and JAM bridge
        run: make fuzz-pvm-upstream
      - name: Show fuzz coverage and bridge accounting
        if: always()
        run: |
          if test -f build/pvm-upstream-fuzz/summary.md; then
            cat build/pvm-upstream-fuzz/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'PVM fuzz campaign did not complete; inspect results.json and logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain fuzz evidence and failing inputs
        if: always()
        uses: *upload-artifact
        with:
          name: pvm-fuzz-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/pvm-upstream-fuzz/*.log
            build/pvm-upstream-fuzz/results.json
            build/pvm-upstream-fuzz/summary.md
            build/pvm-upstream-fuzz/artifacts/

  # Future subsystem campaigns join this aggregate so one green child cannot conceal another failure.
  fuzz-status:
    name: Fuzz
    needs: [pvm-fuzz]
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'fuzz' || inputs.suite == 'full')) || (github.event_name == 'pull_request' && (github.event.label.name == 'ci:fuzz' || github.event.label.name == 'ci:full'))) }}
    strategy: *os-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every Fuzz job
        env:
          PVM_FUZZ_RESULT: ${{ needs.pvm-fuzz.result }}
        run: test "$PVM_FUZZ_RESULT" = success
