name: Linux checks

"on":
  push:
  pull_request:
  workflow_dispatch:

# Test code only needs to read the checkout, including on fork pull requests.
permissions:
  contents: read

# Retire obsolete runs for the same branch/PR without interrupting unrelated checks.
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Codec, crypto and QUIC (Ubuntu 24.04 x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pinned source submodules
        run: python3 tools/setup_submodules.py

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang lld cmake zlib1g-dev openssl patch
          mkdir -p build/ci
          uname -a | tee build/ci/platform.log
          ulimit -a | tee -a build/ci/platform.log
          clang --version | tee -a build/ci/platform.log
          cmake --version | tee -a build/ci/platform.log
          openssl version | tee -a build/ci/platform.log

      - name: Permit Odin's io_uring backend on this temporary runner
        run: |
          # These optional kernel policies can prevent core:nbio from opening its ring.
          for setting in kernel.io_uring_disabled kernel.apparmor_restrict_unprivileged_io_uring; do
            if sysctl "$setting" >/dev/null 2>&1; then
              sudo sysctl -w "$setting=0"
            fi
          done

      - name: Pinned Nim, Odin and odinfmt
        run: python3 tools/setup_ci_linux.py --destination "$RUNNER_TEMP/ragnarok-tools"

      - name: Pinned Rust for Bandersnatch
        run: |
          # Use official rustup component checksums; do not change the runner's default toolchain.
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.99.0" >> "$GITHUB_ENV"
          rustup run 1.99.0 rustc --version
          rustup run 1.99.0 cargo --version

      - name: Pinned Mojo and bundled formatter
        run: |
          # Keep the SDK isolated and require hashes for every compiler/formatter dependency.
          python3 -m venv build/mojo-env
          build/mojo-env/bin/python -m pip install --require-hashes -r tools/mojo-requirements.txt
          build/mojo-env/bin/mojo --version

      - name: Formatting
        run: python3 tools/format.py --check

      - name: Codec conformance and native tests
        run: python3 interoperability/test_codec.py --mojo 2>&1 | tee build/ci/codec.log

      - name: Crypto vectors, ownership and cross-language checks
        run: python3 interoperability/test_crypto.py --mojo --fetch 2>&1 | tee build/ci/crypto.log

      # Clang LTO uses the explicit lld dependency on Linux; all Nim runtime guards remain enabled.
      - name: Checked complete-report and guarantee workload builds
        run: python3 interoperability/benchmark_report.py --build-only 2>&1 | tee build/ci/report-build.log

      - name: Complete-report evidence and oracle integrity
        run: python3 interoperability/test_report_harness.py

      - name: Complete-report nominal type safeguards
        run: python3 interoperability/test_report_types.py

      - name: Complete-report codecs and independent guarantee signatures
        run: python3 interoperability/test_work_report.py --skip-build 2>&1 | tee build/ci/report-codec.log

      - name: Checked complete-report and guarantee comparison (Nim LTO)
        run: python3 interoperability/benchmark_report.py --skip-build 2>&1 | tee build/ci/report-benchmark.log

      - name: Bandersnatch Rust ABI and JAM proof checks
        run: python3 interoperability/test_bandersnatch.py --mojo --fetch 2>&1 | tee build/ci/bandersnatch.log

      - name: Build and verify Linux QUIC
        run: python3 interoperability/test_quic.py --mojo --fetch 2>&1 | tee build/ci/quic.log

      - name: QUIC soak harness regression checks
        run: python3 interoperability/test_quic_soak_harness.py

      - name: Bounded QUIC lifecycle soak
        run: python3 interoperability/test_quic_soak.py --mojo --skip-build 2>&1 | tee build/ci/quic-soak.log

      - name: Persistent multi-peer QUIC service
        run: python3 interoperability/test_quic_service.py --mojo --skip-build 2>&1 | tee build/ci/quic-service.log

      - name: Persistent bidirectional IPv6 QUIC peers
        run: python3 interoperability/test_quic_mesh.py --mojo --skip-build 2>&1 | tee build/ci/quic-mesh.log

      - name: IPv6 peer-loss recovery and admission saturation
        run: python3 interoperability/test_quic_resilience.py --mojo --skip-build 2>&1 | tee build/ci/quic-resilience.log

      - name: Integrated owned codec, crypto and QUIC
        run: python3 interoperability/test_integration.py --mojo --reuse-native 2>&1 | tee build/ci/integration.log

      - name: Bounded Bandersnatch offload alongside QUIC
        run: python3 interoperability/test_quic_offload.py --mojo --reuse-native 2>&1 | tee build/ci/quic-offload.log

      - name: Benchmark evidence integrity checks
        run: python3 interoperability/test_benchmark_harness.py

      - name: Ergonomics measurement integrity
        run: python3 tools/ergonomics/test_tools.py

      - name: Optimized checked codec and hash comparison
        run: python3 interoperability/benchmark.py --mojo --reuse-native 2>&1 | tee build/ci/benchmark.log

      # Upload only explicit diagnostics; dependency trees, certificates and private keys are excluded.
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-verification-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/**/mojo*-build.log
            build/codec/mojo-type-checks.log
            build/crypto/build.log
            build/crypto/type-checks.log
            build/crypto/results.json
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log
            build/bandersnatch/type-checks.log
            build/bandersnatch/results.json
            build/quic/build.log
            build/quic/results.json
            build/quic/cases/*.server.log
            build/quic/soak/results.json
            build/quic/soak/*/*.log
            build/quic/soak/*/resources.json
            build/quic/service/results.json
            build/quic/service/*/*.log
            build/quic/service/*/resources.json
            build/quic/mesh/results.json
            build/quic/mesh/*/*.log
            build/quic/mesh/*/resources.json
            build/quic/resilience/results.json
            build/quic/resilience/*/*.log
            build/quic/resilience/*/resources.json
            build/integration/build.log
            build/integration/results.json
            build/integration/*/*.log
            build/integration/*/resources.json
            build/offload/*.log
            build/offload/results.json
            build/offload/*/*.log
            build/offload/*/resources.json
            build/report/*build*.log
            build/report/*correctness.json
            build/report/*stderr.log
            build/report/*report-types.log
            build/report/type-checks.json
            build/report/results.json
            build/report/results.partial.json
            build/report/results.md
            build/report/raw/**/*.log
            build/bench/report-observers.log
            build/bench/build.log
            build/bench/corpus.json
            build/bench/results.json
            build/bench/results.md
            build/bench/raw/**/*.log
