name: Linux checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Retire obsolete runs while keeping independent branches/PRs separate.
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Nim codec, crypto and QUIC (Ubuntu 24.04 x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pinned source submodules
        run: python3 tools/setup_submodules.py

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang lld cmake zlib1g-dev openssl
          mkdir -p build/ci
          uname -a | tee build/ci/platform.log
          clang --version | tee -a build/ci/platform.log

      - name: Pinned Nim and bundled formatter
        run: python3 tools/setup_ci_linux.py --destination "$RUNNER_TEMP/ragnarok-tools"

      - name: Pinned Rust for Bandersnatch
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.99.0" >> "$GITHUB_ENV"
          rustup run 1.99.0 rustc --version

      - name: Protocol source and migration provenance
        run: python3 tests/test_spec.py

      - name: Formatting
        run: python3 tools/format.py --check

      - name: Codec conformance and native tests
        run: python3 tests/test_codec.py 2>&1 | tee build/ci/codec.log

      - name: Boolean and general bitstring codecs
        run: |
          python3 tests/test_bits_harness.py
          python3 tests/test_bits.py 2>&1 | tee build/ci/bits.log

      - name: Canonical set and dictionary codecs
        run: |
          python3 tests/test_collections_harness.py
          python3 tests/test_collections.py 2>&1 | tee build/ci/collections.log

      - name: Tickets and guarantees extrinsics
        run: |
          python3 tests/test_tickets_harness.py
          python3 tests/test_guarantees_harness.py
          python3 tests/test_tickets.py 2>&1 | tee build/ci/tickets.log
          python3 tests/test_guarantees.py 2>&1 | tee build/ci/guarantees.log

      - name: Disputes extrinsic
        run: |
          python3 tests/test_disputes_harness.py
          python3 tests/test_disputes.py 2>&1 | tee build/ci/disputes.log

      - name: Work-package input codecs
        run: |
          python3 tests/test_package_harness.py
          python3 tests/test_work_package.py 2>&1 | tee build/ci/package.log

      - name: Header and marker codecs
        run: |
          python3 tests/test_header_harness.py
          python3 tests/test_header.py 2>&1 | tee build/ci/header.log

      - name: Complete extrinsic and block codecs
        run: |
          python3 tests/test_block_harness.py
          python3 tests/test_block.py 2>&1 | tee build/ci/block.log

      - name: Crypto vectors, ownership and ABI checks
        run: python3 tests/test_crypto.py --fetch 2>&1 | tee build/ci/crypto.log

      - name: Report codecs, ownership and independent guarantee signatures
        run: python3 tests/test_work_report.py 2>&1 | tee build/ci/report.log

      - name: Report and assurance oracle/type safeguards
        run: |
          python3 tests/test_report_harness.py
          python3 tests/test_report_types.py
          python3 tests/test_assurances_harness.py
          python3 tests/test_assurances_types.py
          python3 tests/test_assurance_crypto_harness.py
          python3 tests/test_assurance_crypto_types.py

      - name: Assurance codecs and signing contexts
        run: |
          python3 tests/test_assurances.py 2>&1 | tee build/ci/assurances.log
          python3 tests/test_assurance_crypto.py 2>&1 | tee build/ci/assurance-crypto.log

      - name: Bandersnatch historical vectors and JAM tickets
        run: python3 tests/test_bandersnatch.py --fetch 2>&1 | tee build/ci/bandersnatch.log

      - name: QUIC startup and lifecycle harness regressions
        run: |
          python3 tests/test_quic_harness.py
          python3 tests/test_quic_soak_harness.py

      - name: Authenticated QUIC and native selftests
        run: python3 tests/test_quic.py --fetch 2>&1 | tee build/ci/quic.log

      - name: QUIC lifecycle soak
        run: python3 tests/test_quic_soak.py --skip-build 2>&1 | tee build/ci/quic-soak.log

      - name: Retained multi-peer service
        run: python3 tests/test_quic_service.py --skip-build 2>&1 | tee build/ci/quic-service.log

      - name: Bidirectional IPv6 peers
        run: python3 tests/test_quic_mesh.py --skip-build 2>&1 | tee build/ci/quic-mesh.log

      - name: Peer-loss recovery and admission saturation
        run: python3 tests/test_quic_resilience.py --skip-build 2>&1 | tee build/ci/quic-resilience.log

      - name: Integrated codec, crypto and QUIC
        run: python3 tests/test_integration.py --reuse-native 2>&1 | tee build/ci/integration.log

      - name: Bounded proof offload alongside QUIC
        run: python3 tests/test_quic_offload.py --reuse-native 2>&1 | tee build/ci/quic-offload.log

      # Certificates/private keys and dependency trees are excluded from uploaded diagnostics.
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-verification-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/collections/*.log
            build/collections/results.json
            build/collections/types/*.log
            build/bits/*.log
            build/bits/results.json
            build/bits/types/*.log
            build/tickets/*.log
            build/tickets/results.json
            build/tickets/types/*.log
            build/tickets/types/results.json
            build/guarantees/*.log
            build/guarantees/results.json
            build/guarantees/types/*.log
            build/guarantees/types/results.json
            build/disputes/*.log
            build/disputes/results.json
            build/disputes/types/*.log
            build/disputes/types/results.json
            build/package/*.log
            build/package/results.json
            build/package/types/*.log
            build/package/types/results.json
            build/header/*.log
            build/header/results.json
            build/header/types/*.log
            build/header/types/results.json
            build/block/*.log
            build/block/results.json
            build/block/types/*.log
            build/block/types/results.json
            build/crypto/*.log
            build/crypto/results.json
            build/bandersnatch/*.log
            build/bandersnatch/results.json
            build/quic/build.log
            build/quic/results.json
            build/quic/cases/*.server.log
            build/quic/soak/results.json
            build/quic/soak/*/*.log
            build/quic/soak/*/resources.json
            build/quic/service/results.json
            build/quic/service/*/*.log
            build/quic/service/*/resources.json
            build/quic/mesh/results.json
            build/quic/mesh/*/*.log
            build/quic/mesh/*/resources.json
            build/quic/resilience/results.json
            build/quic/resilience/*/*.log
            build/quic/resilience/*/resources.json
            build/integration/*.log
            build/integration/results.json
            build/integration/*/*.log
            build/integration/*/resources.json
            build/offload/*.log
            build/offload/results.json
            build/offload/*/*.log
            build/offload/*/resources.json
            build/report/*.log
            build/report/*correctness.json
            build/report/types/*.log
            build/report/types/results.json
            build/assurances/*-build.log
            build/assurances/checks-*/results.json
            build/assurances/checks-*/stderr.log
            build/assurances/types/*.log
            build/assurances/types/results.json
            build/assurance-crypto/*-build.log
            build/assurance-crypto/checks-*/results.json
            build/assurance-crypto/checks-*/stderr.log
            build/assurance-crypto/types/*.log
            build/assurance-crypto/types/results.json
