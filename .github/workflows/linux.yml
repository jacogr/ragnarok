name: Linux

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Retire obsolete runs while keeping independent branches/PRs separate.
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Codec, crypto and QUIC (Ubuntu 24.04 x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Checked codec, crypto, networking and independent harness coverage
        run: make runtime
      - name: Show verification coverage
        if: always()
        run: make summary-runtime SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      # Upload diagnostics only: never binaries, caches, dependency trees, certificates or private keys.
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-runtime-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/runtime/*.log
            build/tests/runtime/results.json
            build/tests/runtime/offload/*.log
            build/tests/runtime/offload/resources.json
            build/tests/runtime/admission/*.log
            build/tests/runtime/admission/resources.json
            build/tests/runtime/closed-before-request/*.log
            build/tests/runtime/endpoint-soak/*.log
            build/tests/runtime/endpoint-soak/resources.json
            build/tests/runtime/mesh/*.log
            build/tests/runtime/mesh/resources.json
            build/tests/runtime/mesh-bad-pin/*.log
            build/tests/runtime/mesh-disruption/*.log
            build/tests/runtime/mesh-disruption/resources.json
            build/tests/runtime/retained-service/*.log
            build/tests/runtime/retained-service/resources.json
            build/tests/runtime/retained-integration/*.log
            build/tests/runtime/retained-integration/resources.json
            build/tests/runtime/peer-cases/**/*.log
            build/tests/runtime/integration-requests.txt
            build/tests/runtime/quic-protocol-requests.txt
            build/quic/build.log
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log

  modules:
    name: All-source compilation gate (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit every source module
        run: make modules
      - name: Show source compilation coverage
        if: always()
        run: make summary-modules SUMMARY_OUTPUT="$GITHUB_STEP_SUMMARY"
      - name: Retain source compilation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-modules-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ci/*.log
            build/tests/modules/*.log
            build/tests/modules/results.json
