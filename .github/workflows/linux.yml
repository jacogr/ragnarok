name: Linux checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Retire obsolete runs while keeping independent branches/PRs separate.
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Nimony codec, crypto and QUIC (Ubuntu 24.04 x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang lld cmake zlib1g-dev openssl
          mkdir -p build/nimony-ci
          uname -a | tee build/nimony-ci/platform.log
          clang --version | tee -a build/nimony-ci/platform.log
      - name: Pinned Nimony and formatter
        run: python3 tools/setup_nimony_ci_linux.py --destination "$RUNNER_TEMP/nimony-tools" 2>&1 | tee build/nimony-ci/setup.log
      - name: Pinned pristine source submodules
        run: python3 tools/setup_submodules.py
      - name: Pinned Rust and locked Bandersnatch registry dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.99.0" >> "$GITHUB_ENV"
          rustup run 1.99.0 cargo fetch --locked --manifest-path native/bandersnatch/Cargo.toml
      - name: CI installer and reporting safeguards
        run: python3 tests/test_nimony_ci.py
      - name: Protocol source and migration provenance
        run: python3 tests/test_spec.py
      - name: Formatting
        run: python3 tools/format.py --check
      - name: Migrated codec, crypto, UDP readiness and native-owner coverage
        run: python3 tools/test_nimony.py --compiler "$NIMONY" 2>&1 | tee build/nimony-ci/runtime.log
      - name: Show measured partial coverage
        if: always()
        run: python3 tools/summarize_nimony_ci.py --kind slice --report build/nimony-trial/verification/results.json --output "$GITHUB_STEP_SUMMARY"
      # Upload diagnostics only: never binaries, caches, dependency trees, certificates or private keys.
      - name: Retain migrated slice evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nimony-linux-runtime-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/nimony-ci/*.log
            build/nimony-trial/verification/*.log
            build/nimony-trial/verification/results.json
            build/nimony-trial/verification/admission/*.log
            build/nimony-trial/verification/admission/resources.json
            build/nimony-trial/verification/closed-before-request/*.log
            build/nimony-trial/verification/endpoint-soak/*.log
            build/nimony-trial/verification/endpoint-soak/resources.json
            build/nimony-trial/verification/mesh/*.log
            build/nimony-trial/verification/mesh/resources.json
            build/nimony-trial/verification/mesh-bad-pin/*.log
            build/nimony-trial/verification/mesh-disruption/*.log
            build/nimony-trial/verification/mesh-disruption/resources.json
            build/nimony-trial/verification/retained-service/*.log
            build/nimony-trial/verification/retained-service/resources.json
            build/nimony-trial/verification/retained-integration/*.log
            build/nimony-trial/verification/retained-integration/resources.json
            build/nimony-trial/verification/peer-cases/**/*.log
            build/nimony-trial/verification/integration-requests.txt
            build/nimony-trial/verification/quic-protocol-requests.txt
            build/quic/build.log
            build/crypto/build.log
            build/bandersnatch/build.log
            build/bandersnatch/cargo-features.log

  modules:
    name: Nimony all-source compilation gate (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang lld
          mkdir -p build/nimony-ci
      - name: Pinned Nimony and formatter
        run: python3 tools/setup_nimony_ci_linux.py --destination "$RUNNER_TEMP/nimony-tools" 2>&1 | tee build/nimony-ci/setup.log
      - name: Audit every source module
        run: python3 tools/audit_nimony_modules.py --compiler "$NIMONY" 2>&1 | tee build/nimony-ci/modules.log
      - name: Show remaining build work
        if: always()
        run: python3 tools/summarize_nimony_ci.py --kind modules --report build/nimony-ci/modules/results.json --output "$GITHUB_STEP_SUMMARY"
      - name: Retain source compilation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nimony-linux-modules-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/nimony-ci/*.log
            build/nimony-ci/modules/*.log
            build/nimony-ci/modules/results.json
