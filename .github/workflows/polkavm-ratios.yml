# Private one-off carrier on the existing manual workflow path.
name: x86 checked-read direct qualification

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x86-checked-read-direct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  direct:
    if: ${{ github.ref == 'refs/heads/codex/pvm-x86-read-native-qualification-version-gate' }}
    name: x86 checked-read leaf and direct ABI
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Checkout sealed carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check linked ABI, emitted bytes and direct outcomes
        env:
          LC_ALL: C
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/qualification/x86-checked-read.py
      - name: Retain first failure or complete direct evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86-checked-read-direct-${{ github.run_attempt }}
          retention-days: 14
          path: build/x86-checked-read-direct/evidence/
          if-no-files-found: error
