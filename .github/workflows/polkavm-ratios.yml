# Explicit pinned-reference calibration stays outside the regular CI job graph.
name: Pinky native comparison and handoff profile

"on":
  workflow_dispatch:
    inputs:
      architecture:
        description: Linux runner architecture
        type: choice
        options: [x86_64, arm64]
        default: x86_64

permissions:
  contents: read

concurrency:
  group: pinky-native-gap-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  UI_MINIFY: "1"

jobs:
  polkavm-ratios:
    name: Perf / Pinky (${{ inputs.architecture }})
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the pinned application baseline
        run: git fetch --no-tags --depth=1 origin e0704df6eb893e4e0c4eb06a0e5ac9c874e210c0
      - name: Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install handoff profile tools
        run: make host-tools PVM_PROFILE_TOOLS=1
      - name: Enable the pinned Linux compiler sandbox
        if: inputs.architecture == 'x86_64'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w vm.unprivileged_userfaultfd=1
      - name: Compare checked Pinky and profile native handoffs
        run: make bench-pvm-pinky-native-gap
      - name: Show complete Pinky timings
        if: always()
        run: |
          if test -f build/tests/pvm-performance/summary.md; then
            cat build/tests/pvm-performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain source, worker-clock, complete-state and timing evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pinky-native-gap-${{ inputs.architecture }}
          path: |
            build/tests/pvm-performance/*.json
            build/tests/pvm-performance/*.log
            build/tests/pvm-performance/*.md
            build/tests/pvm-performance/*.callgrind*
            build/ci/*.log
          if-no-files-found: error
