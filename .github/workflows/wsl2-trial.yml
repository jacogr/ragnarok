# Trial the existing Linux build and storage contracts on a real WSL 2 filesystem.
# A dedicated trial branch permits the first run without merging this experiment.
name: WSL 2 storage trial

"on":
  workflow_dispatch:
  push:
    branches: [codex/wsl2-trial]

permissions:
  contents: read

concurrency:
  group: wsl2-trial-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  storage:
    name: Trial / WSL 2 build and storage
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Install Ubuntu on WSL 2
        run: |
          # Native command failures must fail the step rather than fall through.
          $ErrorActionPreference = 'Stop'
          wsl --version
          if ($LASTEXITCODE -ne 0) { throw 'WSL version query failed' }
          wsl --set-default-version 2
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select WSL 2' }
          wsl --install --distribution Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'Ubuntu installation failed' }
          wsl --list --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect WSL distributions' }

      - name: Build and exercise storage inside the Linux filesystem
        run: |
          $ErrorActionPreference = 'Stop'
          # Save LF-only Bash outside the checkout; build data stays in Linux ext4.
          $script = @'
          #!/usr/bin/env bash
          set -euo pipefail
          repository=$1
          revision=$2
          # Require WSL 2 and its Linux filesystem, never silently test WSL 1/DrvFS.
          uname -r | grep -Ei 'microsoft.*WSL2'
          test "$(stat -f -c %T /home)" = ext2/ext3
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates clang cmake git lld make openssl \
            python3 rustup sudo xz-utils zlib1g-dev
          # Exercise permissions and process locks as an ordinary Linux user.
          useradd --create-home --shell /bin/bash trial
          echo 'trial ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/wsl-trial
          chmod 0440 /etc/sudoers.d/wsl-trial
          runuser -u trial -- bash -s -- "$repository" "$revision" <<'TRIAL'
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          export CI=true PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 UI_MINIFY=1
          cd "$HOME"
          git init ragnarok
          cd ragnarok
          git remote add origin "https://github.com/$1.git"
          git fetch --depth=1 origin "$2"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$2"
          mkdir -p build/ci
          # Record the exact revision, guest and filesystem alongside test evidence.
          { git rev-parse HEAD; uname -a; cat /etc/os-release; findmnt -T .; id; } \
            | tee build/ci/wsl-environment.log
          make build 2>&1 | tee build/ci/wsl-build.log
          build/ragnarok --selftest 2>&1 | tee build/ci/wsl-selftest.log
          # Existing output contracts and fault injection determine each verdict.
          # Stop at the first failure so a later pass cannot hide an earlier refusal.
          for suite in \
            pvm_resident_bytes \
            storage_full_paged_crashes \
            storage_full_paged_readers \
            storage_interrupted_locks \
            storage_paged_crashes \
            storage_paged_restart \
            storage_process_lease_crash; do
            make unit SUITE="$suite" 2>&1 | tee "build/ci/wsl-$suite.log"
          done
          TRIAL
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'wsl2-trial.sh'
          [IO.File]::WriteAllText($scriptPath, $script.Replace("`r`n", "`n"), [Text.UTF8Encoding]::new($false))
          $linuxPath = wsl -d Ubuntu-24.04 -u root --exec wslpath -u $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Cannot translate trial script path' }
          wsl -d Ubuntu-24.04 -u root --exec bash $linuxPath $env:GITHUB_REPOSITORY $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'WSL build or storage trial failed' }

      - name: Collect Linux diagnostics
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'wsl2-evidence'
          New-Item -ItemType Directory -Force $destination | Out-Null
          # The Windows status receipt remains available even if Ubuntu never booted.
          wsl --list --verbose 2>&1 | Out-File (Join-Path $destination 'wsl-status.log')
          $linuxDestination = wsl -d Ubuntu-24.04 -u root --exec wslpath -u $destination
          if ($LASTEXITCODE -ne 0) { throw 'Ubuntu unavailable; see WSL status receipt' }
          # Copy only diagnostics; exclude binaries, dependencies and generated keys.
          wsl -d Ubuntu-24.04 -u root --exec bash -c 'set -euo pipefail; cd /home/trial/ragnarok; for directory in build/ci build/tests/native; do if test -d "$directory"; then find "$directory" -type f \( -name "*.log" -o -name "*.json" \) -print0; fi; done | tar --null -T - -cf - | tar -xf - -C "$1"' trial $linuxDestination
          if ($LASTEXITCODE -ne 0) { throw 'Cannot collect Linux diagnostics' }

      - name: Retain trial evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl2-storage-trial-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wsl2-evidence
          retention-days: 7
          if-no-files-found: error
