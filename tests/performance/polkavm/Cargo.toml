# Optional speed measurements through pinned public APIs; no production integration.
[package]
name = "ragnarok-pvm-benchmark"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
libc = "=0.2.154"
polkavm = { path = "../../../vendor/polkavm/crates/polkavm" }
polkavm-common = { path = "../../../vendor/polkavm/crates/polkavm-common", features = ["alloc"] }
picosimd = { version = "=0.9.6", features = ["ops"] }

# Match the pinned upstream workspace's canonical release profile.
[profile.release]
lto = true
codegen-units = 1
debug = true
