# Headless pinned-ELF preparation and interpreter-only correctness/profiling driver.
[package]
name = "ragnarok-pvm-doom"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
libc = "=0.2.154"
polkavm = { path = "../../../vendor/polkavm/crates/polkavm" }
polkavm-common = { path = "../../../vendor/polkavm/crates/polkavm-common", features = ["alloc"] }
polkavm-linker = { path = "../../../vendor/polkavm/crates/polkavm-linker" }
[profile.release]
lto = true
codegen-units = 1
debug = true
