# Reviewed fixture rebuild manifest; upstream algorithm attribution is in README.md.
[package]
name = "bench-minimal"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bench_minimal"
path = "src/main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "bench-minimal"
path = "src/main.rs"

[target.'cfg(not(target_os = "solana"))'.dependencies]
picoalloc = { workspace = true }

[target.'cfg(target_os = "solana")'.dependencies]
simplealloc = { path = "@POLKAVM_ROOT@/guest-programs/simplealloc" }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = { path = "@POLKAVM_ROOT@/crates/polkavm-derive" }

[lints]
workspace = true
