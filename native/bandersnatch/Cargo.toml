# Defines the maintained Bandersnatch bridge crate and its pinned Rust dependencies. Exposes the
# library build configuration consumed by Cargo and the native build tooling.

[package]
name = "ragnarok-bandersnatch"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ark-vrf = { version = "=0.6.0", path = "../../vendor/ark-vrf", default-features = false, features = ["std", "bandersnatch", "ring", "secret-split"] }

# Reuse the existing digest/zeroize closure; zebra 4 retains SHA-2 0.10 compatibility.
blake2 = "=0.10.6"
ed25519-zebra = { version = "=4.2.0", default-features = false, features = ["std"] }
sha3 = "=0.10.9"
zeroize = "=1.9.1"

[profile.release]
panic = "unwind"
