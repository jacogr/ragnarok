# Defines the maintained Bandersnatch bridge crate and its pinned Rust dependencies. Exposes the
# library build configuration consumed by Cargo and the native build tooling.

[package]
name = "ragnarok-bandersnatch"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ark-vrf = { path = "../../vendor/ark-vrf", features = ["bandersnatch", "ring", "secret-split"] }

[profile.release]
panic = "unwind"
